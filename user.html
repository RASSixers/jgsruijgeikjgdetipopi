<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile — Sixers Hoops</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/navbar-styles.css">
    <style>
        :root {
            --navy: #001a57;
            --sixers-blue: #006BB6;
            --sixers-red: #ED174C;
            --cream: #f7f8fc;
            --ink: #0d0f1a;
            --mid: #64748b;
            --border-light: #e4e8f0;
            --card-bg: #ffffff;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Lexend', system-ui, sans-serif;
            background: var(--cream);
            color: var(--ink);
            padding-top: 60px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        :root.dark-mode body { background: #0b0f1a; color: #e8eaf0; }

        /* ── Profile Banner ── */
        .profile-banner {
            background: var(--cream);
            border-bottom: 1px solid var(--border-light);
            padding: 2rem 0 0;
            position: relative;
            overflow: hidden;
        }

        .profile-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(0,107,182,0.1) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        .profile-banner-glow {
            position: absolute;
            right: -80px; top: -60px;
            width: 500px; height: 400px;
            background: radial-gradient(ellipse at center, rgba(0,107,182,0.07) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        :root.dark-mode .profile-banner {
            background: linear-gradient(135deg, #0a1628 0%, #0d1f3c 40%, #0a1628 100%);
            border-bottom-color: rgba(255,255,255,0.07);
        }

        .profile-banner-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        .profile-identity {
            display: flex;
            align-items: flex-end;
            gap: 1.25rem;
            padding-bottom: 1.25rem;
            min-width: 0;
        }

        .profile-avatar-wrap { position: relative; flex-shrink: 0; }

        .profile-avatar-large {
            width: 84px; height: 84px;
            border-radius: 50%;
            border: 3px solid rgba(0,107,182,0.3);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Lexend', system-ui, sans-serif;
            font-weight: 900; font-size: 2rem;
            color: white; overflow: hidden;
            background: var(--navy);
            box-shadow: 0 4px 20px rgba(0,107,182,0.18);
        }

        .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }

        .profile-identity-info { flex: 1; min-width: 0; }

        .profile-displayname {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 1.85rem; font-weight: 900;
            letter-spacing: -0.01em;
            color: var(--ink); line-height: 1.05;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        :root.dark-mode .profile-displayname { color: #ffffff; }

        .profile-handle { font-size: 0.8rem; color: var(--mid); margin-top: 3px; }

        .profile-stats-row {
            display: flex; align-items: center; gap: 0.5rem;
            margin-top: 0.55rem; font-size: 0.82rem; color: var(--mid);
        }

        .profile-stats-row strong {
            color: var(--ink); font-weight: 700;
            font-family: 'Lexend', system-ui, sans-serif; font-size: 1rem;
        }

        :root.dark-mode .profile-stats-row { color: rgba(255,255,255,0.55); }
        :root.dark-mode .profile-stats-row strong { color: #ffffff; }
        .profile-stats-dot { opacity: 0.35; }
        .stat-link { cursor: pointer; border: none; background: none; padding: 0; font: inherit; color: inherit; }
        .stat-link:hover strong { color: var(--sixers-blue); text-decoration: underline; }
        .followers-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9999;
            align-items: center; justify-content: center; padding: 1rem;
        }
        .followers-modal-overlay.open { display: flex; }
        .followers-modal {
            background: #fff; border-radius: 12px; width: min(420px, 100%); max-height: 70vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,.2);
        }
        :root.dark-mode .followers-modal { background: #12141c; color: #e8eaf0; }
        .followers-modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: .9rem 1rem; border-bottom: 1px solid var(--border-light, #e4e8f0);
            font-weight: 800; font-size: .95rem;
        }
        .followers-modal-list { overflow: auto; padding: .5rem 0; }
        .followers-row {
            display: flex; align-items: center; gap: .75rem; padding: .65rem 1rem;
            text-decoration: none; color: inherit; cursor: pointer;
        }
        .followers-row:hover { background: rgba(0,107,182,.06); }
        .followers-row img, .followers-row .fr-av {
            width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
        }
        .followers-row .fr-av {
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #fff; font-size: .9rem;
        }
        .followers-row .fr-name { font-weight: 700; font-size: .88rem; }
        .followers-empty { padding: 2rem 1rem; text-align: center; color: var(--mid); font-size: .85rem; }
        .inbox-view-btn {
            margin-left: auto; flex-shrink: 0; font-size: .72rem; font-weight: 700;
            color: var(--sixers-blue); background: rgba(0,107,182,.08); border: 1px solid rgba(0,107,182,.2);
            border-radius: 6px; padding: .3rem .55rem; cursor: pointer; text-decoration: none;
            white-space: nowrap;
        }
        .inbox-view-btn:hover { background: rgba(0,107,182,.15); }
        .inbox-item { position: relative; }
        .feed-vote {
            display: inline-flex; align-items: center; gap: 0.15rem;
            border: none; background: transparent; cursor: pointer;
            color: var(--mid); padding: 0.2rem 0.35rem; border-radius: 6px;
            font-size: 0.78rem; font-weight: 700;
        }
        .feed-vote:hover { background: rgba(0,107,182,.06); color: var(--ink); }
        .feed-vote.active-up { color: #ea580c; background: transparent !important; }
        .feed-vote.active-up svg { stroke: #ea580c; }
        .feed-vote.active-down { color: #2563eb; background: transparent !important; }
        .feed-vote.active-down svg { stroke: #2563eb; }
        .feed-vote:hover { background: transparent; }
        .feed-vote svg { width: 14px; height: 14px; }
        .inbox-actions {
            display: flex; align-items: center; gap: 0.35rem; margin-top: 0.55rem; flex-wrap: wrap;
        }
        .inbox-reply-box {
            margin-top: 0.55rem; display: none; width: 100%;
        }
        .inbox-reply-box.open { display: block; }
        .inbox-reply-box textarea {
            width: 100%; min-height: 64px; border: 1px solid rgba(0,0,0,.12);
            border-radius: 8px; padding: 0.55rem 0.65rem; font: inherit; font-size: 0.85rem;
            box-sizing: border-box; resize: vertical;
        }
        .inbox-reply-actions { display: flex; gap: 0.4rem; margin-top: 0.4rem; justify-content: flex-end; }
        .inbox-reply-actions button {
            border: none; border-radius: 6px; padding: 0.4rem 0.75rem; font-weight: 700;
            font-size: 0.8rem; cursor: pointer;
        }
        .inbox-reply-cancel { background: #f1f5f9; color: #334155; }
        .inbox-reply-send { background: #006BB6; color: #fff; }
        .sh-toast {
          position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120%);
          background: #0f172a; color: #fff; padding: 0.75rem 1.25rem; border-radius: 999px;
          font-size: 0.88rem; font-weight: 600; z-index: 10050;
          box-shadow: 0 12px 30px rgba(0,0,0,.25);
          transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s; opacity: 0;
          display: flex; align-items: center; gap: 0.5rem; max-width: min(90vw, 360px);
        }
        .sh-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }



        .profile-actions {
            display: flex; align-items: flex-end; gap: 0.6rem;
            padding-bottom: 1.25rem; flex-shrink: 0;
        }

        .btn-follow {
            padding: 0.5rem 1.35rem;
            background: var(--sixers-blue); color: white;
            border: none; border-radius: 8px;
            font-family: 'Lexend', system-ui, sans-serif;
            font-weight: 700; font-size: 0.8rem;
            letter-spacing: 0.07em; text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, transform 0.12s, box-shadow 0.2s;
            box-shadow: 0 4px 12px -4px rgba(0,107,182,0.45);
        }

        .btn-follow:hover { background: #0080d4; transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(0,107,182,0.55); }

        .btn-follow.following {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--mid); box-shadow: none;
        }

        :root.dark-mode .btn-follow.following {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.7);
        }

        .btn-icon {
            width: 38px; height: 38px; border-radius: 8px;
            background: var(--card-bg); border: 1px solid var(--border-light);
            color: var(--mid); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .btn-icon:hover { background: rgba(0,107,182,0.06); border-color: rgba(0,107,182,0.3); color: var(--sixers-blue); }
        .btn-icon svg { width: 15px; height: 15px; }

        :root.dark-mode .btn-icon {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.12); color: rgba(255,255,255,0.6);
        }

        /* ── Profile Tabs ── */
        .profile-tabs {
            display: flex; gap: 0;
            border-top: 1px solid var(--border-light); margin-top: 0.5rem;
        }

        :root.dark-mode .profile-tabs { border-top-color: rgba(255,255,255,0.07); }

        .profile-tab {
            padding: 0.8rem 1.3rem;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 0.76rem; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--mid);
            border: none; border-bottom: 2px solid transparent;
            background: transparent; cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap; text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.4rem;
        }

        .profile-tab:hover { color: var(--ink); }
        :root.dark-mode .profile-tab { color: rgba(255,255,255,0.45); }
        :root.dark-mode .profile-tab:hover { color: rgba(255,255,255,0.8); }

        .profile-tab.active { color: var(--sixers-blue); border-bottom-color: var(--sixers-blue); }
        :root.dark-mode .profile-tab.active { color: #4da8ff; border-bottom-color: #4da8ff; }

        .tab-notif-pill {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 16px; height: 16px; padding: 0 4px;
            border-radius: 999px; background: var(--sixers-red);
            color: #fff; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.02em;
        }

        .tab-notif-pill.hidden { display: none; }

        /* ── Layout ── */
        .profile-content {
            max-width: 1100px;
            margin: 1.75rem auto;
            padding: 0 1.5rem 4rem;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 284px;
            gap: 1.5rem;
            align-items: start;
            width: 100%;
            box-sizing: border-box;
        }
        .profile-main { min-width: 0; }

        /* ── Sort bar ── */
        .sort-bar {
            display: flex; align-items: center; gap: 0.25rem;
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 10px; padding: 0.35rem; margin-bottom: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        :root.dark-mode .sort-bar { background: #161b27; border-color: rgba(255,255,255,0.07); box-shadow: none; }

        .sort-btn {
            display: flex; align-items: center; gap: 0.35rem;
            padding: 0.4rem 0.9rem; border-radius: 7px; border: none;
            background: transparent;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 0.73rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--mid); cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .sort-btn svg { width: 13px; height: 13px; }
        .sort-btn:hover { color: var(--ink); background: rgba(0,107,182,0.06); }
        .sort-btn.active { background: rgba(0,107,182,0.08); color: var(--sixers-blue); }

        :root.dark-mode .sort-btn { color: rgba(255,255,255,0.45); }
        :root.dark-mode .sort-btn:hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.06); }
        :root.dark-mode .sort-btn.active { background: rgba(255,255,255,0.09); color: #ffffff; }

        /* ── Feed cards ── */
        .feed-list { display: flex; flex-direction: column; gap: 0.7rem; }

        .feed-card {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 12px; padding: 1.1rem 1.25rem;
            transition: border-color 0.15s, box-shadow 0.15s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        .feed-card:hover { border-color: rgba(0,107,182,0.3); box-shadow: 0 4px 16px rgba(0,107,182,0.08); }

        :root.dark-mode .feed-card { background: #161b27; border-color: rgba(255,255,255,0.07); box-shadow: none; }
        :root.dark-mode .feed-card:hover { border-color: rgba(0,107,182,0.35); background: #1a2035; }

        .feed-card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.65rem; }

        .feed-card-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Lexend', system-ui, sans-serif; font-weight: 800;
            font-size: 0.75rem; color: white; overflow: hidden; flex-shrink: 0;
        }

        .feed-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .feed-card-username { font-size: 0.82rem; font-weight: 600; color: var(--ink); }
        :root.dark-mode .feed-card-username { color: #c8cfe0; }
        .feed-card-time { font-size: 0.72rem; color: var(--mid); margin-left: auto; }

        .feed-card-title {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 1rem; font-weight: 700;
            color: var(--ink); letter-spacing: -0.01em;
            margin-bottom: 0.35rem; line-height: 1.3;
        }

        :root.dark-mode .feed-card-title { color: #ffffff; }

        .feed-card-body {
            font-size: 0.83rem; color: var(--mid); line-height: 1.55;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 0.75rem;
        }

        :root.dark-mode .feed-card-body { color: rgba(255,255,255,0.55); }

        .feed-card-footer { display: flex; align-items: center; gap: 0.5rem; }

        .feed-card-action {
            display: flex; align-items: center; gap: 0.3rem;
            padding: 0.3rem 0.7rem; border-radius: 6px;
            border: 1px solid var(--border-light); background: transparent;
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 0.72rem; font-weight: 700;
            letter-spacing: 0.04em; text-transform: uppercase;
            color: var(--mid); cursor: pointer;
            transition: background 0.12s, color 0.12s, border-color 0.12s; text-decoration: none;
        }

        .feed-card-action:hover { background: rgba(0,107,182,0.05); color: var(--sixers-blue); border-color: rgba(0,107,182,0.25); }
        .feed-card-action svg { width: 12px; height: 12px; }
        .feed-card-action.view-post { margin-left: auto; }

        :root.dark-mode .feed-card-action { border-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); }
        :root.dark-mode .feed-card-action:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); border-color: rgba(255,255,255,0.15); }

        .feed-card.is-comment { border-left: 3px solid rgba(0,107,182,0.35); }
        .post-context { font-size: 0.72rem; color: var(--mid); margin-bottom: 0.4rem; }
        .post-context a { color: var(--sixers-blue); text-decoration: none; }
        .post-context a:hover { text-decoration: underline; }
        .feed-card-snippet { font-size: 0.83rem; color: var(--mid); line-height: 1.5; }
        :root.dark-mode .feed-card-snippet { color: rgba(255,255,255,0.65); }

        /* ── Sidebar ── */
        .profile-sidebar { display: flex; flex-direction: column; gap: 1rem; }

        .sidebar-card {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 12px; padding: 1.1rem 1.15rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        :root.dark-mode .sidebar-card { background: #161b27; border-color: rgba(255,255,255,0.07); box-shadow: none; }

        .sidebar-card-title {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 0.7rem; font-weight: 800;
            letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--mid); margin-bottom: 0.75rem;
        }

        :root.dark-mode .sidebar-card-title { color: rgba(255,255,255,0.4); }

        .sidebar-about-bio { font-size: 0.83rem; color: var(--mid); line-height: 1.55; margin-bottom: 0.75rem; }
        :root.dark-mode .sidebar-about-bio { color: rgba(255,255,255,0.6); }

        .sidebar-meta-item {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 0.8rem; color: var(--mid); margin-bottom: 0.45rem;
        }

        .sidebar-meta-item svg { width: 13px; height: 13px; opacity: 0.5; flex-shrink: 0; }

        .sidebar-stat-row {
            display: flex; gap: 1.25rem; margin-top: 0.6rem;
            padding-top: 0.6rem; border-top: 1px solid var(--border-light);
        }

        :root.dark-mode .sidebar-stat-row { border-top-color: rgba(255,255,255,0.06); }

        .sidebar-stat { text-align: center; }

        .sidebar-stat-num {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 1.5rem; font-weight: 900; color: var(--ink); line-height: 1;
        }

        :root.dark-mode .sidebar-stat-num { color: #ffffff; }

        .sidebar-stat-label {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 0.65rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--mid); margin-top: 2px;
        }

        .btn-create-post {
            display: block; width: 100%; padding: 0.75rem;
            background: var(--sixers-blue); color: white; border: none; border-radius: 8px;
            font-family: 'Lexend', system-ui, sans-serif; font-weight: 800;
            font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; text-align: center; text-decoration: none;
            transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
            margin-top: 0.75rem; box-shadow: 0 4px 12px -4px rgba(0,107,182,0.4);
        }

        .btn-create-post:hover { background: #0080d4; transform: translateY(-1px); box-shadow: 0 8px 18px -6px rgba(0,107,182,0.5); }

        /* ── Panel (Inbox / Notifications) ── */
        .panel-wrap {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
        }

        :root.dark-mode .panel-wrap { background: #161b27; border-color: rgba(255,255,255,0.07); box-shadow: none; }

        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);
        }

        :root.dark-mode .panel-header { border-bottom-color: rgba(255,255,255,0.07); }

        .panel-title {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 1.1rem; font-weight: 700; color: var(--ink);
        }

        :root.dark-mode .panel-title { color: #ffffff; }

        .panel-title-count {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em;
            color: white; background: var(--sixers-red);
            padding: 2px 8px; border-radius: 999px; margin-left: 0.5rem;
        }

        .panel-title-count.hidden { display: none; }

        .panel-action-btn {
            font-family: 'Lexend', system-ui, sans-serif; font-size: 0.73rem;
            font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--sixers-blue); background: none; border: none; cursor: pointer;
        }

        /* ── Inbox items ── */
        .inbox-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-light);
            display: flex; gap: 0.9rem; align-items: flex-start;
            cursor: pointer; transition: background 0.15s; position: relative;
        }

        :root.dark-mode .inbox-item { border-bottom-color: rgba(255,255,255,0.05); }
        .inbox-item:last-child { border-bottom: none; }
        .inbox-item:hover { background: rgba(0,107,182,0.03); }
        :root.dark-mode .inbox-item:hover { background: rgba(255,255,255,0.04); }
        .inbox-item.unread { background: rgba(0,107,182,0.04); }
        :root.dark-mode .inbox-item.unread { background: rgba(0,107,182,0.1); }

        .inbox-item-avatar {
            width: 38px; height: 38px; border-radius: 50%; background: var(--navy);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Lexend', system-ui, sans-serif; font-weight: 800;
            font-size: 0.9rem; color: white; overflow: hidden; flex-shrink: 0;
        }

        .inbox-item-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .inbox-item-body { flex: 1; min-width: 0; }

        .inbox-item-from { font-weight: 700; font-size: 0.85rem; color: var(--ink); margin-bottom: 2px; }
        :root.dark-mode .inbox-item-from { color: #e8eaf0; }

        .inbox-item-preview { font-size: 0.8rem; color: var(--mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        :root.dark-mode .inbox-item-preview { color: rgba(255,255,255,0.45); }
        .inbox-item-preview.unread-preview { font-weight: 600; color: var(--ink); }
        :root.dark-mode .inbox-item-preview.unread-preview { color: #e8eaf0; }

        .inbox-item-meta { font-size: 0.72rem; color: var(--mid); white-space: nowrap; margin-left: 0.5rem; flex-shrink: 0; }

        .unread-dot {
            width: 7px; height: 7px; border-radius: 50%; background: var(--sixers-blue);
            position: absolute; left: 0.45rem; top: 50%; transform: translateY(-50%);
        }

        /* ── Notification items ── */
        .notif-item {
            padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border-light);
            display: flex; gap: 0.75rem; align-items: flex-start;
            cursor: pointer; transition: background 0.15s;
        }

        :root.dark-mode .notif-item { border-bottom-color: rgba(255,255,255,0.05); }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: rgba(0,107,182,0.03); }
        :root.dark-mode .notif-item:hover { background: rgba(255,255,255,0.04); }
        .notif-item.unread { background: rgba(0,107,182,0.04); }
        :root.dark-mode .notif-item.unread { background: rgba(0,107,182,0.1); }

        .notif-icon {
            width: 34px; height: 34px; border-radius: 50%;
            background: rgba(0,107,182,0.1); display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--sixers-blue);
        }

        .notif-icon svg { width: 15px; height: 15px; }

        .notif-text { font-size: 0.82rem; color: var(--ink); line-height: 1.45; flex: 1; }
        :root.dark-mode .notif-text { color: #e8eaf0; }
        .notif-text strong { font-weight: 700; }
        .notif-time { font-size: 0.72rem; color: var(--mid); white-space: nowrap; flex-shrink: 0; }

        /* ── States ── */
        .empty-state { padding: 3.5rem 1rem; text-align: center; color: var(--mid); }

        .empty-state p {
            font-family: 'Lexend', system-ui, sans-serif; font-size: 0.85rem;
            font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
        }

        :root.dark-mode .empty-state { color: rgba(255,255,255,0.25); }

        .skeleton {
            background: linear-gradient(90deg, #e8edf5 25%, #f0f4fb 50%, #e8edf5 75%);
            background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
        }

        :root.dark-mode .skeleton {
            background: linear-gradient(90deg, #1a2035 25%, #21284a 50%, #1a2035 75%);
            background-size: 200% 100%;
        }

        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        .not-found-wrap {
            text-align: center; padding: 6rem 1.5rem; grid-column: 1 / -1;
        }

        .not-found-wrap h1 {
            font-family: 'Lexend', system-ui, sans-serif;
            font-size: 2rem; font-weight: 900; color: var(--ink); margin-bottom: 0.75rem;
        }

        :root.dark-mode .not-found-wrap h1 { color: #ffffff; }

        .not-found-wrap p { color: var(--mid); font-size: 0.9rem; margin-bottom: 1.5rem; }

        .not-found-wrap a {
            color: var(--sixers-blue); font-family: 'Lexend', system-ui, sans-serif;
            font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none;
        }

        .not-found-wrap a:hover { text-decoration: underline; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .profile-content {
                grid-template-columns: 1fr;
                padding: 0 1rem 3rem;
                margin-top: 1.25rem;
                gap: 1.25rem;
            }
            .profile-sidebar {
                display: flex;
                order: 2;
            }
            .profile-main {
                order: 1;
                min-width: 0;
            }
        }

        @media (max-width: 768px) {
            body { padding-top: 56px; overflow-x: hidden; }

            .profile-banner { padding: 1.25rem 0 0; }
            .profile-banner-inner { padding: 0 1rem; }
            .profile-banner-glow { display: none; }

            .profile-identity {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.85rem;
                padding-bottom: 1rem;
            }
            .profile-avatar-large {
                width: 72px;
                height: 72px;
                font-size: 1.65rem;
            }
            .profile-identity-info {
                width: 100%;
                min-width: 0;
            }
            .profile-displayname {
                font-size: 1.45rem;
                line-height: 1.15;
                word-break: break-word;
                overflow-wrap: anywhere;
            }
            .profile-handle {
                font-size: 0.78rem;
                word-break: break-all;
            }
            .profile-stats-row {
                flex-wrap: wrap;
                gap: 0.35rem 0.55rem;
                font-size: 0.78rem;
            }

            .profile-actions {
                width: 100%;
                padding-bottom: 0.85rem;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem;
            }
            .btn-follow {
                flex: 1 1 auto;
                min-width: 120px;
                text-align: center;
                padding: 0.55rem 1rem;
            }

            .profile-tabs {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                border-top: 1px solid var(--border-light);
                margin: 0 -1rem;
                padding: 0 0.5rem;
            }
            .profile-tabs::-webkit-scrollbar { display: none; }
            .profile-tab {
                padding: 0.75rem 0.85rem;
                font-size: 0.68rem;
                flex-shrink: 0;
            }

            .profile-content {
                grid-template-columns: 1fr;
                padding: 0 0.85rem 3rem;
                margin: 1rem auto 0;
            }
            .profile-sidebar { display: flex; width: 100%; }
            .sidebar-card { width: 100%; }

            .sort-bar {
                flex-wrap: wrap;
                gap: 0.2rem;
                padding: 0.3rem;
            }
            .sort-btn {
                padding: 0.4rem 0.65rem;
                font-size: 0.68rem;
            }

            .feed-card {
                padding: 0.85rem 0.9rem;
                border-radius: 10px;
            }
            .feed-card-title {
                font-size: 0.95rem;
                line-height: 1.35;
                word-break: break-word;
            }
            .feed-card-body {
                font-size: 0.86rem;
                word-break: break-word;
            }
            .feed-card-footer {
                flex-wrap: wrap;
                gap: 0.4rem;
            }
            .feed-card-action.view-post {
                margin-left: 0;
            }

            .inbox-item {
                padding: 0.85rem 0.9rem;
                gap: 0.7rem;
            }
            .inbox-actions {
                width: 100%;
            }

            .panel-header,
            .inbox-header {
                padding-left: 0.25rem;
                padding-right: 0.25rem;
            }

            .followers-modal {
                width: min(100%, 420px);
                max-height: 75vh;
            }
        }

        @media (max-width: 480px) {
            .profile-displayname { font-size: 1.28rem; }
            .profile-avatar-large { width: 64px; height: 64px; font-size: 1.45rem; }
            .profile-tab { padding: 0.7rem 0.65rem; font-size: 0.64rem; letter-spacing: 0.06em; }
            .btn-follow { font-size: 0.72rem; padding: 0.5rem 0.85rem; }
            .btn-icon { width: 36px; height: 36px; }
            .feed-card-header { gap: 0.45rem; }
            .feed-card-time { font-size: 0.68rem; }
        }
    </style>
  <link rel="stylesheet" href="/theme.css" id="site-theme-css" />
</head>
<body>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="/nav.js"></script>

    <div id="pageBanner">
        <div class="profile-banner">
            <div class="profile-banner-inner">
                <div class="profile-identity">
                    <div class="skeleton" style="width:84px;height:84px;border-radius:50%;flex-shrink:0;"></div>
                    <div style="flex:1;">
                        <div class="skeleton" style="height:28px;width:38%;margin-bottom:10px;"></div>
                        <div class="skeleton" style="height:13px;width:22%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="profile-content" id="pageContent">
        <div>
            <div class="skeleton" style="height:46px;border-radius:10px;margin-bottom:1rem;"></div>
            <div class="skeleton" style="height:110px;border-radius:12px;margin-bottom:0.7rem;"></div>
            <div class="skeleton" style="height:110px;border-radius:12px;margin-bottom:0.7rem;"></div>
            <div class="skeleton" style="height:110px;border-radius:12px;"></div>
        </div>
        <div>
            <div class="skeleton" style="height:220px;border-radius:12px;"></div>
        </div>
    </div>

    <script>
    (function() {
       const FB_CONFIG = {
    apiKey: "AIzaSyBzMlBV5gbZZlg_eTwNWrRDrhx-_ATIPS0",
    authDomain: "auth.sixershoops.com",
    projectId: "pickem-1e12b",
    storageBucket: "pickem-1e12b.appspot.com",
    messagingSenderId: "715626120695",
    appId: "1:715626120695:web:4942646cf3d6ca7e181af2"
};
        // ── URL routing ─────────────────────────────────────────
        // Clean URLs (requires server rewrite of /user/* → /user.html):
        //   /user/<username>                → posts (default)
        //   /user/<username>/inbox          → inbox panel
        //   /user/<username>/notifications  → notifications panel
        //   /user/<username>/settings       → account settings panel
        // Legacy ?u=<username>&#hash kept for backwards compatibility.

        // Restore pretty URL from 404.html soft-router (GitHub Pages)
        (function () {
            try {
                var spa = sessionStorage.getItem('spa_user_path');
                if (spa) {
                    sessionStorage.removeItem('spa_user_path');
                    history.replaceState(null, '', spa);
                }
            } catch (e) {}
        })();

        const SUBPAGES = ['inbox','notifications','settings','bookmarks'];

        function parseRoute() {
            const path = location.pathname.replace(/\/+$/, ''); // trim trailing /
            const m = path.match(/^\/user\/([^\/]+)(?:\/([^\/]+))?$/);
            if (m) {
                return {
                    slug: decodeURIComponent(m[1]),
                    sub: SUBPAGES.includes(m[2]) ? m[2] : null
                };
            }
            // Legacy fallback: ?u=name (+ optional #inbox/#notifications/#settings)
            const qp = new URLSearchParams(location.search);
            const legacySlug = qp.get('u') || '';
            const hash = location.hash.replace('#','');
            return {
                slug: legacySlug,
                sub: SUBPAGES.includes(hash) ? hash : null
            };
        }

        let { slug, sub: currentSubPage } = parseRoute();

        // Re-render on back/forward
        window.addEventListener('popstate', () => {
            const r = parseRoute();
            currentSubPage = r.sub;
            if (gUserData) {
                renderBanner(gUserData, gPosts.length, gMyUid);
                document.getElementById('pageContent').innerHTML = `
                    <div id="feedContent"></div>
                    <div class="profile-sidebar"><div id="sidebarContent"></div></div>`;
                renderSidebar(gUserData, gPosts.length, gMyUid);
                if (currentSubPage === 'inbox') renderInbox(gMyUid);
                else if (currentSubPage === 'notifications') renderNotifications(gMyUid);
                else if (currentSubPage === 'bookmarks') renderBookmarks(gMyUid);
                else if (currentSubPage === 'settings') renderSettings(gUserData, gMyUid);
                else renderFeed();
            }
        });
        // Legacy hashchange support
        window.addEventListener('hashchange', () => window.dispatchEvent(new Event('popstate')));


        let currentTab = 'posts';
        let currentSort = 'new';
        let gUserData = null;
        let gMyUid = null;
        let gPosts = [];
        let gComments = [];

        // ── Utils ─────────────────────────────────────────────────
        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s; return d.innerHTML;
        }

        function timeAgo(ts) {
            try {
                const date = ts && ts.toDate ? ts.toDate() : new Date(ts);
                const s = Math.floor((Date.now() - date) / 1000);
                if (s < 60) return 'just now';
                for (const [sec, l] of [[31536000,'y'],[2592000,'mo'],[86400,'d'],[3600,'h'],[60,'m']]) {
                    const n = Math.floor(s / sec);
                    if (n >= 1) return n + l;
                }
            } catch(_) {}
            return '';
        }

        function fmtDate(iso) {
            try { return new Date(iso).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }); }
            catch(_) { return ''; }
        }

        function colorFor(s) {
            const c = ['#001a57','#006BB6','#c0392b','#475569','#1e293b','#0057a0'];
            if (!s) return c[0];
            let h = 0;
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffffffff;
            return c[Math.abs(h) % c.length];
        }

        function mkAvatar(photoURL, name, color, size) {
            const bg = photoURL ? '#0b0f1a' : (color || colorFor(name));
            const inner = photoURL
                ? `<img src="${esc(photoURL)}" alt="" style="width:100%;height:100%;object-fit:cover;">`
                : (name || 'U').charAt(0).toUpperCase();
            return `<div class="feed-card-avatar" style="width:${size}px;height:${size}px;background:${bg};">${inner}</div>`;
        }

        function userBase() {
            // Pretty paths (GitHub Pages uses 404.html router to keep these working)
            return slug ? ('/user/' + encodeURIComponent(slug)) : '/user.html';
        }
        function tabHref(sub) {
            return sub ? (userBase() + '/' + sub) : userBase();
        }

        // Intercept clicks on profile-tab anchors to do client-side nav (no full reload).
        document.addEventListener('click', (e) => {
            const a = e.target.closest('a.profile-tab');
            if (!a) return;
            const href = a.getAttribute('href') || '';
            if (!(href.startsWith('/user/') || href.startsWith('/user.html'))) return;
            e.preventDefault();
            history.pushState(null, '', href);
            window.dispatchEvent(new Event('popstate'));
        });

        // ── Banner ─────────────────────────────────────────────────
        function renderBanner(ud, postCount, myUid) {
            const isOwn = myUid && myUid === ud._uid;
            const avatarBg = ud.photoURL ? '#0b0f1a' : (ud.avatarColor || '#001a57');
            const avatarInner = ud.photoURL
                ? `<img src="${esc(ud.photoURL)}" alt="">`
                : (ud.username || 'U').charAt(0).toUpperCase();

            document.getElementById('pageBanner').innerHTML = `
            <div class="profile-banner">
                <div class="profile-banner-glow"></div>
                <div class="profile-banner-inner">
                    <div class="profile-identity">
                        <div class="profile-avatar-wrap">
                            <div class="profile-avatar-large" style="background:${avatarBg}">${avatarInner}</div>
                        </div>
                        <div class="profile-identity-info">
                            <div class="profile-displayname">${esc(ud.username || 'Unknown')}</div>
                            <div class="profile-handle">u/${esc(ud.usernameLower || ud.username || '')}</div>
                            <div class="profile-stats-row">
                                <button type="button" class="stat-link" id="openFollowersBtn"><strong>${ud.followerCount || 0}</strong> Followers</button>
                                <span class="profile-stats-dot">·</span>
                                <button type="button" class="stat-link" id="openFollowingBtn"><strong>${ud.followingCount || 0}</strong> Following</button>
                            </div>
                        </div>
                        <div class="profile-actions">
                            ${isOwn
                                ? `<button class="btn-follow" id="bannerEditBtn">Edit Profile</button>`
                                : `<button class="btn-follow" id="bannerFollowBtn">Follow</button>`}
                            <button class="btn-icon" id="bannerShareBtn" title="Share profile">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="profile-tabs" id="profileTabs">
                        <!-- tabs injected below -->
                    </div>
                </div>
            </div>`;

            // Build tabs — always the full set so switching never shrinks the bar
            const tabsEl = document.getElementById('profileTabs');
            const onFeed = !currentSubPage; // posts / comments / likes (in-page)
            const activeFeed = onFeed ? (currentTab || 'posts') : '';
            tabsEl.innerHTML = `
                <a class="profile-tab ${activeFeed==='posts'?'active':''}" href="${tabHref(null)}" data-tab="posts">Posts</a>
                <a class="profile-tab ${activeFeed==='comments'?'active':''}" href="${tabHref(null)}" data-tab="comments">Comments</a>
                <a class="profile-tab ${activeFeed==='likes'?'active':''}" href="${tabHref(null)}" data-tab="likes">Likes</a>
                ${isOwn ? `
                <a class="profile-tab ${currentSubPage==='bookmarks'?'active':''}" href="${tabHref('bookmarks')}">Bookmarks</a>
                <a class="profile-tab ${currentSubPage==='inbox'?'active':''}" href="${tabHref('inbox')}">
                    Inbox <span id="tab-inbox-count" class="tab-notif-pill hidden"></span>
                </a>
                <a class="profile-tab ${currentSubPage==='notifications'?'active':''}" href="${tabHref('notifications')}">
                    Notifications <span id="tab-notif-count" class="tab-notif-pill hidden"></span>
                </a>
                <a class="profile-tab ${currentSubPage==='settings'?'active':''}" href="${tabHref('settings')}">Settings</a>` : ''}`;

            // Posts / Comments / Likes stay on the main profile and switch in-page
            tabsEl.querySelectorAll('.profile-tab[data-tab]').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const which = tab.getAttribute('data-tab');
                    if (!which) return;
                    // If we're on a sub-page, go back to main profile feed first
                    if (currentSubPage) {
                        e.preventDefault();
                        currentTab = which;
                        currentSubPage = null;
                        history.pushState(null, '', tabHref(null));
                        if (gUserData) {
                            renderBanner(gUserData, gPosts.length, gMyUid);
                            document.getElementById('pageContent').innerHTML = `
                                <div id="feedContent"></div>
                                <div class="profile-sidebar"><div id="sidebarContent"></div></div>`;
                            renderSidebar(gUserData, gPosts.length, gMyUid);
                            renderFeed();
                        }
                        return;
                    }
                    e.preventDefault();
                    tabsEl.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentTab = which;
                    renderFeed();
                });
            });

            // Wire up action buttons
            const followBtn = document.getElementById('bannerFollowBtn');
            if (followBtn && myUid && ud._uid && myUid !== ud._uid) {
                const db = getDB();
                const followId = myUid + '_' + ud._uid;
                let isFollowing = false;
                const refreshFollowBtn = () => {
                    followBtn.textContent = isFollowing ? 'Following' : 'Follow';
                    followBtn.classList.toggle('following', isFollowing);
                };
                if (db) {
                    db.collection('follows').doc(followId).get().then(snap => {
                        isFollowing = snap.exists;
                        refreshFollowBtn();
                    }).catch(() => {});
                }
                followBtn.addEventListener('click', async (ev) => {
                    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
                    if (!db) { alert('Not connected. Try again.'); return; }
                    const me = (window.auth && window.auth.currentUser) || firebase.auth().currentUser;
                    if (!me) { document.getElementById('navSignInBtn')?.click(); return; }
                    if (me.uid === ud._uid) return;
                    followBtn.disabled = true;
                    const liveFollowId = me.uid + '_' + ud._uid;
                    try {
                        const ref = db.collection('follows').doc(liveFollowId);
                        const snap = await ref.get();
                        if (snap.exists) {
                            await ref.delete();
                            isFollowing = false;
                            try {
                                await db.collection('users').doc(ud._uid).set({
                                    followerCount: Math.max(0, (ud.followerCount || 1) - 1)
                                }, { merge: true });
                                ud.followerCount = Math.max(0, (ud.followerCount || 1) - 1);
                            } catch (_) {}
                        } else {
                            // Plain JSON only — never FieldValue/serverTimestamp (causes "custom Cl object" errors)
                            const followPayload = {
                                followerId: String(me.uid),
                                followingId: String(ud._uid),
                                followerName: String(me.displayName || (me.email ? me.email.split('@')[0] : 'fan')),
                                followingName: String(ud.username || ud.usernameLower || ''),
                                createdAt: String(new Date().toISOString())
                            };
                            await ref.set(JSON.parse(JSON.stringify(followPayload)));
                            isFollowing = true;
                            try {
                                await db.collection('users').doc(String(ud._uid)).set({
                                    followerCount: Number(ud.followerCount || 0) + 1
                                }, { merge: true });
                                ud.followerCount = Number(ud.followerCount || 0) + 1;
                            } catch (_) {}
                            try {
                                const notifPayload = {
                                    recipientId: String(ud._uid),
                                    type: 'follow',
                                    fromUserId: String(me.uid),
                                    fromName: String(me.displayName || 'fan'),
                                    text: 'started following you',
                                    message: 'started following you',
                                    read: false,
                                    createdAt: String(new Date().toISOString())
                                };
                                await db.collection('notifications').add(JSON.parse(JSON.stringify(notifPayload)));
                            } catch (_) {}
                        }
                        refreshFollowBtn();
                        const stats = document.querySelector('.profile-stats-row');
                        if (stats) {
                            const strongs = stats.querySelectorAll('strong');
                            if (strongs[0]) strongs[0].textContent = String(ud.followerCount || 0);
                        }
                    } catch (err) {
                        console.error('Follow error:', err);
                        const msg = (err && err.message) ? err.message : String(err);
                        if (/permission|insufficient|Missing or insufficient/i.test(msg)) {
                            alert('Follow blocked by Firestore rules. In Firebase Console → Firestore → Rules, allow authenticated users to create/delete docs in the "follows" collection.');
                        } else {
                            alert('Could not update follow: ' + msg);
                        }
                    } finally {
                        followBtn.disabled = false;
                    }
                });
            }

            const editBtn = document.getElementById('bannerEditBtn');
            if (editBtn) {
                editBtn.addEventListener('click', () => {
                    history.pushState(null, '', tabHref('settings'));
                    window.dispatchEvent(new Event('popstate'));
                });
            }

            document.getElementById('bannerShareBtn')?.addEventListener('click', () => {
                const url = `https://sixershoops.com${userBase()}`;
                if (navigator.share) navigator.share({ title: ud.username, url });
                else navigator.clipboard?.writeText(url);
            });

        function ensureAuthUser() {
            try {
                return (window.auth && window.auth.currentUser) || (firebase.auth && firebase.auth().currentUser) || null;
            } catch (_) { return null; }
        }
        function normalizeCommentList(raw) {
            if (!raw) return [];
            if (Array.isArray(raw)) return raw.map(c => ({ voters: {}, votes: 0, ...c, voters: Object.assign({}, (c && c.voters) || {}) }));
            if (typeof raw === 'object') return Object.keys(raw).map(k => ({ id: k, voters: {}, votes: 0, ...raw[k], voters: Object.assign({}, (raw[k] && raw[k].voters) || {}) }));
            return [];
        }
        async function voteOnComment(tradeId, commentId, dir) {
            const user = ensureAuthUser();
            if (!user) { document.getElementById('navSignInBtn')?.click(); return; }
            const db = getDB();
            if (!db || !tradeId || !commentId) return;
            try {
                const ref = db.collection('community_trades').doc(tradeId);
                const snap = await ref.get();
                if (!snap.exists) { alert('Post not found'); return; }
                const data = snap.data() || {};
                const comments = normalizeCommentList(data.comments);
                const c = comments.find(x => x.id === commentId);
                if (!c) { alert('Comment not found'); return; }
                if (!c.voters) c.voters = {};
                const cur = c.voters[user.uid];
                let votes = Number(c.votes) || 0;
                if (cur === dir) {
                    votes += dir === 'up' ? -1 : 1;
                    delete c.voters[user.uid];
                } else {
                    if (cur === 'up') votes -= 1;
                    if (cur === 'down') votes += 1;
                    votes += dir === 'up' ? 1 : -1;
                    c.voters[user.uid] = dir;
                }
                c.votes = votes;
                await ref.update({ comments });
                return { votes, dir: c.voters[user.uid] || null };
            } catch (err) {
                console.error(err);
                alert(err.message || 'Could not save vote');
            }
        }
        async function voteOnPost(tradeId, dir) {
            const user = ensureAuthUser();
            if (!user) { document.getElementById('navSignInBtn')?.click(); return; }
            const db = getDB();
            if (!db || !tradeId) return;
            try {
                const ref = db.collection('community_trades').doc(tradeId);
                const snap = await ref.get();
                if (!snap.exists) return;
                const data = snap.data() || {};
                const voters = Object.assign({}, data.voters || {});
                let votes = Number(data.votes) || 0;
                const cur = voters[user.uid];
                if (cur === dir) {
                    votes += dir === 'up' ? -1 : 1;
                    delete voters[user.uid];
                } else {
                    if (cur === 'up') votes -= 1;
                    if (cur === 'down') votes += 1;
                    votes += dir === 'up' ? 1 : -1;
                    voters[user.uid] = dir;
                }
                await ref.update({ votes, voters });
                return { votes, dir: voters[user.uid] || null };
            } catch (err) {
                console.error(err);
                alert(err.message || 'Could not save vote');
            }
        }
        async function replyToComment(tradeId, parentId, text) {
            const user = ensureAuthUser();
            if (!user) { document.getElementById('navSignInBtn')?.click(); return; }
            const db = getDB();
            if (!db || !tradeId || !text) return;
            text = String(text).trim().slice(0, 2000);
            if (!text) return;
            try {
                const ref = db.collection('community_trades').doc(tradeId);
                const snap = await ref.get();
                if (!snap.exists) { alert('Post not found'); return; }
                const data = snap.data() || {};
                const comments = normalizeCommentList(data.comments);
                const parent = comments.find(x => x.id === parentId);
                const newComment = {
                    id: 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                    parentId: parentId || null,
                    replyToAuthor: parent ? (parent.author || '') : null,
                    author: 'u/' + (user.displayName || (user.email ? user.email.split('@')[0] : 'fan')),
                    authorId: user.uid,
                    authorPhoto: localStorage.getItem('photoURL') || user.photoURL || '',
                    text: text,
                    votes: 0,
                    voters: {},
                    createdAt: new Date().toISOString()
                };
                comments.push(newComment);
                await ref.update({ comments });
                // Notify parent author
                if (parent && parent.authorId && parent.authorId !== user.uid) {
                    try {
                        await db.collection('notifications').add({
                            type: 'comment_reply',
                            recipientId: parent.authorId,
                            fromUserId: user.uid,
                            fromName: user.displayName || 'fan',
                            tradeId: tradeId,
                            tradeTitle: data.title || '',
                            commentId: newComment.id,
                            commentText: text.slice(0, 300),
                            text: 'replied to your comment',
                            message: 'replied to your comment',
                            read: false,
                            createdAt: new Date().toISOString(),
                            link: '/community/p/' + encodeURIComponent(tradeId) + '#comment-' + encodeURIComponent(newComment.id)
                        });
                    } catch (_) {}
                }
                return newComment;
            } catch (err) {
                console.error(err);
                alert(err.message || 'Could not post reply');
            }
        }
        function wireVoteReplyButtons(root) {
            const scope = root || document;
            scope.querySelectorAll('.vote-up').forEach(btn => {
                if (btn._wired) return; btn._wired = true;
                btn.addEventListener('click', async (e) => {
                    e.preventDefault(); e.stopPropagation();
                    const tradeId = btn.getAttribute('data-trade');
                    const cid = btn.getAttribute('data-cid');
                    const res = await voteOnComment(tradeId, cid, 'up');
                    if (!res) return;
                    const countEl = btn.parentElement && btn.parentElement.querySelector('.c-vote-count');
                    if (countEl) countEl.textContent = String(res.votes);
                    btn.classList.toggle('active-up', res.dir === 'up');
                    const down = btn.parentElement && btn.parentElement.querySelector('.vote-down');
                    if (down) down.classList.toggle('active-down', res.dir === 'down');
                });
            });
            scope.querySelectorAll('.vote-down').forEach(btn => {
                if (btn._wired) return; btn._wired = true;
                btn.addEventListener('click', async (e) => {
                    e.preventDefault(); e.stopPropagation();
                    const tradeId = btn.getAttribute('data-trade');
                    const cid = btn.getAttribute('data-cid');
                    const res = await voteOnComment(tradeId, cid, 'down');
                    if (!res) return;
                    const countEl = btn.parentElement && btn.parentElement.querySelector('.c-vote-count');
                    if (countEl) countEl.textContent = String(res.votes);
                    btn.classList.toggle('active-down', res.dir === 'down');
                    const up = btn.parentElement && btn.parentElement.querySelector('.vote-up');
                    if (up) up.classList.toggle('active-up', res.dir === 'up');
                });
            });
            scope.querySelectorAll('.vote-post-up').forEach(btn => {
                if (btn._wired) return; btn._wired = true;
                btn.addEventListener('click', async (e) => {
                    e.preventDefault(); e.stopPropagation();
                    const res = await voteOnPost(btn.getAttribute('data-trade'), 'up');
                    if (!res) return;
                    const countEl = btn.parentElement && btn.parentElement.querySelector('.c-vote-count');
                    if (countEl) countEl.textContent = String(res.votes);
                    btn.classList.toggle('active-up', res.dir === 'up');
                    const down = btn.parentElement && btn.parentElement.querySelector('.vote-post-down');
                    if (down) down.classList.toggle('active-down', res.dir === 'down');
                });
            });
            scope.querySelectorAll('.vote-post-down').forEach(btn => {
                if (btn._wired) return; btn._wired = true;
                btn.addEventListener('click', async (e) => {
                    e.preventDefault(); e.stopPropagation();
                    const res = await voteOnPost(btn.getAttribute('data-trade'), 'down');
                    if (!res) return;
                    const countEl = btn.parentElement && btn.parentElement.querySelector('.c-vote-count');
                    if (countEl) countEl.textContent = String(res.votes);
                    btn.classList.toggle('active-down', res.dir === 'down');
                    const up = btn.parentElement && btn.parentElement.querySelector('.vote-post-up');
                    if (up) up.classList.toggle('active-up', res.dir === 'up');
                });
            });
            scope.querySelectorAll('.reply-btn').forEach(btn => {
                if (btn._wired) return; btn._wired = true;
                btn.addEventListener('click', (e) => {
                    e.preventDefault(); e.stopPropagation();
                    const tradeId = btn.getAttribute('data-trade');
                    const cid = btn.getAttribute('data-cid');
                    const boxId = 'reply-box-' + cid;
                    let box = document.getElementById(boxId);
                    if (!box) {
                        // create under the card
                        box = document.createElement('div');
                        box.className = 'inbox-reply-box';
                        box.id = boxId;
                        const card = btn.closest('.feed-card, .inbox-item');
                        if (card) card.appendChild(box);
                    }
                    box.classList.add('open');
                    box.innerHTML = `<textarea placeholder="Write a reply…"></textarea>
                        <div class="inbox-reply-actions">
                          <button type="button" class="inbox-reply-cancel">Cancel</button>
                          <button type="button" class="inbox-reply-send">Reply</button>
                        </div>`;
                    const ta = box.querySelector('textarea');
                    ta.focus();
                    box.querySelector('.inbox-reply-cancel').onclick = () => { box.classList.remove('open'); box.innerHTML = ''; };
                    box.querySelector('.inbox-reply-send').onclick = async () => {
                        const text = ta.value.trim();
                        if (!text) return;
                        const btnSend = box.querySelector('.inbox-reply-send');
                        btnSend.disabled = true; btnSend.textContent = 'Posting…';
                        const res = await replyToComment(tradeId, cid, text);
                        if (res) {
                            box.classList.remove('open'); box.innerHTML = '';
                            showToast('Reply posted');
                        } else {
                            btnSend.disabled = false; btnSend.textContent = 'Reply';

            });
        }

        async function openFollowList(uid, mode) {
            let overlay = document.getElementById('followersModalOverlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'followersModalOverlay';
                overlay.className = 'followers-modal-overlay';
                overlay.innerHTML = `<div class="followers-modal">
                    <div class="followers-modal-head">
                        <span id="followersModalTitle">Followers</span>
                        <button type="button" id="followersModalClose" style="border:none;background:none;font-size:1.4rem;cursor:pointer;line-height:1;">&times;</button>
                    </div>
                    <div class="followers-modal-list" id="followersModalList"><div class="followers-empty">Loading…</div></div>
                </div>`;
                document.body.appendChild(overlay);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
                document.getElementById('followersModalClose').onclick = () => overlay.classList.remove('open');
            }
            const title = document.getElementById('followersModalTitle');
            const list = document.getElementById('followersModalList');
            title.textContent = mode === 'following' ? 'Following' : 'Followers';
            list.innerHTML = '<div class="followers-empty">Loading…</div>';
            overlay.classList.add('open');

            const db = getDB();
            if (!db || !uid) { list.innerHTML = '<div class="followers-empty">Unavailable</div>'; return; }
            try {
                const field = mode === 'following' ? 'followerId' : 'followingId';
                const snap = await db.collection('follows').where(field, '==', uid).limit(100).get();
                const rows = snap.docs.map(d => d.data());
                const otherIds = rows.map(r => mode === 'following' ? r.followingId : r.followerId).filter(Boolean);
                if (!otherIds.length) {
                    list.innerHTML = `<div class="followers-empty">No ${mode === 'following' ? 'following' : 'followers'} yet</div>`;
                    return;
                }
                // Load user docs
                const users = {};
                await Promise.all(otherIds.slice(0, 50).map(async (id) => {
                    try {
                        const doc = await db.collection('users').doc(id).get();
                        if (doc.exists) users[id] = { id, ...doc.data() };
                        else users[id] = { id, username: id.slice(0, 8), usernameLower: id.slice(0, 8) };
                    } catch (_) {
                        users[id] = { id, username: 'user', usernameLower: 'user' };
                    }
                }));
                list.innerHTML = otherIds.map(id => {
                    const u = users[id] || { username: 'user', usernameLower: 'user' };
                    const name = u.username || u.usernameLower || 'user';
                    const slug = (u.usernameLower || name).toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
                    const photo = u.photoURL || '';
                    const color = u.avatarColor || colorFor(name);
                    const av = photo
                        ? `<img src="${esc(photo)}" alt="">`
                        : `<div class="fr-av" style="background:${color}">${esc((name||'U').charAt(0).toUpperCase())}</div>`;
                    return `<a class="followers-row" href="/user/${encodeURIComponent(slug)}">${av}<div class="fr-name">${esc(name)}</div></a>`;
                }).join('');
            } catch (err) {
                console.error(err);
                list.innerHTML = '<div class="followers-empty">Could not load list</div>';
            }
        }

        function renderBookmarks(myUid) {
            const fc = document.getElementById('feedContent');
            if (!fc) return;
            myUid = myUid || gMyUid || (window.auth && window.auth.currentUser && window.auth.currentUser.uid) || null;
            if (!myUid || !gUserData || myUid !== gUserData._uid) {
                fc.innerHTML = `<div class="empty-state"><p>Bookmarks are private. Sign in to view yours.</p></div>`;
                return;
            }
            fc.innerHTML = `
            <div class="panel-wrap">
                <div class="panel-header"><span class="panel-title">Bookmarks</span></div>
                <div id="bookmarksList"><div class="empty-state"><p>Loading…</p></div></div>
            </div>`;

            let ids = [];
            try { ids = JSON.parse(localStorage.getItem('sixershoops_bookmarked_trades') || '[]'); } catch(_) {}
            if (!Array.isArray(ids)) ids = [];
            ids = ids.filter(Boolean);

            const listEl = document.getElementById('bookmarksList');
            const db = getDB();
            if (!ids.length) {
                listEl.innerHTML = `<div class="empty-state"><p>No bookmarks yet. Tap the bookmark icon on any post to save it here.</p></div>`;
                return;
            }
            if (!db) {
                listEl.innerHTML = `<div class="empty-state"><p>Could not load bookmarks.</p></div>`;
                return;
            }

            Promise.all(ids.slice(0, 50).map(id => db.collection('community_trades').doc(id).get().catch(() => null)))
              .then(docs => {
                const items = [];
                docs.forEach((doc, i) => {
                  if (doc && doc.exists) items.push({ id: doc.id, ...doc.data() });
                });
                // prune missing ids from localStorage
                const alive = new Set(items.map(x => x.id));
                const pruned = ids.filter(id => alive.has(id));
                try { localStorage.setItem('sixershoops_bookmarked_trades', JSON.stringify(pruned)); } catch(_){}

                if (!items.length) {
                  listEl.innerHTML = `<div class="empty-state"><p>No bookmarks yet.</p></div>`;

                items.sort((a,b) => {

                });

              });
        }

        function renderInbox(myUid) {

                  const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);

        // ── Notifications ─────────────────────────────────────────
        function renderNotifications(myUid) {
            const fc = document.getElementById('feedContent');
            if (!fc) return;
            const db = getDB();

            fc.innerHTML = `
            <div class="panel-wrap">
                <div class="panel-header">
                    <div style="display:flex;align-items:center;">
                        <span class="panel-title">Notifications</span>
                        <span id="notif-panel-count" class="panel-title-count hidden"></span>

                document.getElementById('notifList').innerHTML = `<div class="empty-state"><p>Sign in to view notifications</p></div>`;
