<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sixers Hoops — Article</title>
<meta name="description" content="News and analysis for Philadelphia 76ers fans." />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/navbar-styles.css" />
<style>
  :root {
    --navy: #001a57;
    --sixers-blue: #006bb6;
    --sixers-red: #ed174c;
    --cream: #ffffff;
    --ink: #0d0f1a;
    --mid: #64748b;
    --border-light: #e4e8f0;
    --card-bg: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Lexend", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    margin-top: 64px;
  }
  a { color: inherit; }

  .article-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.75rem 1.5rem 5rem;
  }
  .article-back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--sixers-blue);
    text-decoration: none;
    margin-bottom: 2rem;
  }
  .article-back:hover { text-decoration: underline; }

  .article-header {
    text-align: center;
    margin: 0 auto 2rem;
    max-width: 40rem;
  }
  .article-tag {
    display: inline-flex;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    margin-bottom: 1.1rem;
  }
  .article-title {
    font-size: clamp(1.85rem, 4.5vw, 2.75rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.12;
    margin: 0 0 1rem;
    color: var(--ink);
  }
  .article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.55rem;
    font-size: 0.88rem;
    color: var(--mid);
    justify-content: center;
    align-items: center;
  }
  .article-meta .meta-dot {
    color: #cbd5e1;
  }
  .article-excerpt {
    font-size: 1.12rem;
    line-height: 1.65;
    color: #475569;
    margin: 1.35rem auto 0;
    font-weight: 400;
    max-width: 36rem;
  }
  .article-divider {
    width: 3rem;
    height: 3px;
    background: var(--sixers-blue);
    border-radius: 2px;
    margin: 1.75rem auto 2rem;
  }
  .article-hero {
    margin: 0 0 0.5rem;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border-light);
  }
  .article-hero img {
    width: 100%;
    max-height: 440px;
    object-fit: cover;
    display: block;
  }
  .article-photo-credit {
    font-size: 0.75rem;
    color: #94a3b8;
    margin: 0 0 1.75rem;
    line-height: 1.4;
    text-align: center;
  }
  .article-body {
    margin-top: 0.25rem;
  }
  .article-body p {
    font-size: 1.08rem;
    line-height: 1.8;
    color: #1e293b;
    margin: 0 0 1.45rem;
    white-space: pre-wrap;
  }
  .article-body .article-inline-img {
    margin: 1.75rem 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border-light);
    background: #f8fafc;
  }
  .article-body .article-inline-img img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 560px;
    object-fit: contain;
  }
  .article-body .article-inline-img figcaption {
    font-size: 0.82rem;
    color: var(--mid);
    padding: 0.6rem 0.9rem 0.75rem;
    line-height: 1.4;
    text-align: center;
  }

  .tweet-embed-wrap {
    margin: 1.75rem 0;
    background: #f8fafc;
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 1.1rem 1.25rem 0.65rem;
    overflow: hidden;
  }
  .tweet-embed-wrap .twitter-tweet { margin: 0 auto !important; }
  .tweet-fallback-card { font-size: 0.85rem; color: var(--mid); }
  .tweet-fallback-card a { color: var(--sixers-blue); font-weight: 600; text-decoration: none; }
  .tweet-fallback-card a:hover { text-decoration: underline; }

  .grades-section { margin: 2.75rem 0 1.5rem; }
  .grades-heading {
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 1.15rem;
    padding-bottom: 0.65rem;
    border-bottom: 2px solid var(--ink);
  }
  .grade-card {
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 1.15rem 1.2rem;
    margin-bottom: 0.85rem;
    display: flex;
    gap: 1rem;
    align-items: flex-start;
    background: #fff;
    transition: border-color 0.15s;
  }
  .grade-card:hover { border-color: #d0d7e2; }
  .grade-pill {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.05rem;
  }
  .grade-card-body { flex: 1; min-width: 0; }
  .grade-card-name { font-size: 1.02rem; font-weight: 700; margin: 0 0 0.25rem; letter-spacing: -0.015em; }
  .grade-card-stats { font-size: 0.84rem; color: var(--mid); margin: 0 0 0.55rem; line-height: 1.4; }
  .grade-card-analysis { font-size: 0.95rem; line-height: 1.6; color: #1e293b; margin: 0; }
  .grade-card-tweet { margin-top: 0.9rem; }

  .bottom-line {
    margin: 2.25rem 0 0;
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 1.25rem 1.35rem 1.35rem;
    background: linear-gradient(180deg, #f8fafc 0%, #fff 100%);
  }
  .bottom-line-label {
    display: block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sixers-blue);
    margin-bottom: 0.5rem;
  }
  .bottom-line p {
    margin: 0;
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .article-locked {
    text-align: center;
    padding: 3.5rem 1.5rem;
    background: #f8fafc;
    border: 1px solid var(--border-light);
    border-radius: 16px;
  }
  .article-locked h1 {
    font-size: 1.35rem;
    font-weight: 800;
    margin: 0 0 0.5rem;
  }
  .article-locked p { color: var(--mid); margin: 0; }

  .more-section { margin-top: 2.75rem; }
  .more-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 0.9rem; }
  .more-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .more-item {
    display: block;
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    background: #fff;
    text-decoration: none;
  }
  .more-item-title { font-size: 1rem; font-weight: 700; line-height: 1.3; margin: 0.4rem 0 0.3rem; }
  .more-item-excerpt { font-size: 0.86rem; line-height: 1.5; color: var(--mid); margin: 0 0 0.4rem; }
  .more-item-meta { font-size: 0.75rem; color: var(--mid); }

  .article-state { text-align: center; padding: 5rem 1rem; color: var(--mid); }
  .article-state h2 { font-size: 1.4rem; color: var(--ink); margin: 0 0 0.5rem; }
  .article-skel { background: linear-gradient(90deg, var(--border-light) 25%, #f0f3f8 37%, var(--border-light) 63%); background-size: 400% 100%; animation: skel-shine 1.4s ease infinite; border-radius: 8px; }
  @keyframes skel-shine { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  @media (max-width: 600px) {
    .article-wrap { padding: 1.75rem 1.1rem 3.5rem; }
    .grade-card { flex-direction: column; }
  }
</style>
</head>
<body>
<main>
  <div class="article-wrap" id="article-root">
    <a href="/" class="article-back">← Back to Sixers Hoops</a>
    <div class="article-skel" style="height:28px;width:120px;margin-bottom:1rem;"></div>
    <div class="article-skel" style="height:42px;width:90%;margin-bottom:2rem;"></div>
    <div class="article-skel" style="aspect-ratio:21/9;width:100%;margin-bottom:2rem;"></div>
    <div class="article-skel" style="height:16px;width:100%;margin-bottom:0.75rem;"></div>
    <div class="article-skel" style="height:16px;width:95%;margin-bottom:0.75rem;"></div>
    <div class="article-skel" style="height:16px;width:88%;"></div>
  </div>
</main>

<script src="/nav.js"></script>
<script>
const NEWS_COLLECTION = 'editorial_articles';
const CATEGORY_COLORS = {'Player Grades':'#1e7d46','Analysis':'#006BB6','Opinion':'#b06b00','Preview':'#ED174C','Recap':'#475569','News':'#0077cc'};
const GRADE_COLORS = {'A+':'#1a6b3c','A':'#1e7d46','A-':'#2d8f56','B+':'#006BB6','B':'#0077cc','B-':'#2a85d0','C+':'#b06b00','C':'#c27800','D+':'#b83232','D':'#a02828','F':'#7a1a1a','INC':'#6b21a8'};

function waitForDb(cb, tries) {
  tries = tries || 0;
  if (window.db) { cb(); return; }
  if (tries > 60) { renderError('Could not connect right now. Please refresh and try again.'); return; }
  setTimeout(function () { waitForDb(cb, tries + 1); }, 250);
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getSlugFromPath() {
  var path = (window.location.pathname || '').replace(/\/+$/, '');
  var fromPath = path.match(/^\/article\/(.+)$/i);
  if (fromPath && fromPath[1] && fromPath[1].toLowerCase() !== 'article.html' && fromPath[1].toLowerCase() !== 'articles.html') {
    return decodeURIComponent(fromPath[1]);
  }
  return new URLSearchParams(window.location.search).get('slug') || null;
}

function toDate(ts) {
  if (!ts) return null;
  if (ts.toDate) return ts.toDate();
  return new Date(ts);
}

function timeAgo(date) {
  if (!date) return '';
  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
  if (seconds < 60) return 'Just now';
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return mins + 'm ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h ago';
  const days = Math.floor(hours / 24);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + 'd ago';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function readMinutes(a) {
  const text = [a.excerpt, a.intro, a.closing].join(' ') +
    (a.grades || []).map(function (g) { return (g.analysis || '') + ' ' + (g.stats || ''); }).join(' ');
  const words = String(text).trim() ? String(text).trim().split(/\s+/).length : 0;
  return Math.max(1, Math.round(words / 220)) + ' min read';
}

function isPublished(a) {
  if (a && a.status === 'draft') return false;
  return !a.status || a.status === 'published';
}

function tweetEmbedHtml(url) {
  const safeUrl = escapeHtml(url);
  return (
    '<div class="tweet-embed-wrap">' +
      '<blockquote class="twitter-tweet"><a href="' + safeUrl + '"></a></blockquote>' +
      '<noscript><div class="tweet-fallback-card">View this post on <a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">X / Twitter</a>.</div></noscript>' +
    '</div>'
  );
}
function isTweetUrl(line) {
  return /^https?:\/\/(?:www\.)?(?:x\.com|twitter\.com)\/[^\s]+\/status\/\d+/i.test(String(line || '').trim());
}
function isImageUrl(line) {
  const s = String(line || '').trim();
  // Direct image URLs or common CDNs
  if (/^https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif)(?:\?\S*)?$/i.test(s)) return true;
  if (/^https?:\/\/(?:i\.imgur\.com|images\.unsplash\.com|cdn\.nba\.com|a\.espncdn\.com)\S+/i.test(s)) return true;
  return false;
}
function parseMarkdownImage(line) {
  const m = String(line || '').trim().match(/^!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)$/);
  if (!m) return null;
  return { alt: m[1] || '', src: m[2] };
}
function imageEmbedHtml(src, alt) {
  const safeSrc = escapeHtml(src);
  const safeAlt = escapeHtml(alt || '');
  return (
    '<figure class="article-inline-img">' +
      '<img src="' + safeSrc + '" alt="' + safeAlt + '" loading="lazy">' +
      (safeAlt ? '<figcaption>' + safeAlt + '</figcaption>' : '') +
    '</figure>'
  );
}
/** Parse article body into paragraphs, tweet embeds, and images. */
function renderBodyHtml(raw) {
  const text = String(raw || '').replace(/\r\n/g, '\n').trim();
  if (!text) return { html: '', tweetUrls: [] };
  const blocks = text.split(/\n{2,}/);
  const tweetUrls = [];
  const parts = [];
  blocks.forEach(function (block) {
    const lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return;
    // Single-line special blocks
    if (lines.length === 1) {
      const line = lines[0];
      const mdImg = parseMarkdownImage(line);
      if (mdImg) {
        parts.push(imageEmbedHtml(mdImg.src, mdImg.alt));
        return;
      }
      if (isTweetUrl(line)) {
        const url = line.replace(/[.,;:!?)]+$/, '');
        tweetUrls.push(url);
        parts.push(tweetEmbedHtml(url));
        return;
      }
      if (isImageUrl(line)) {
        const url = line.replace(/[.,;:!?)]+$/, '');
        parts.push(imageEmbedHtml(url, ''));
        return;
      }
    }
    // Multi-line: check each line for embeds mixed with text
    let paraBuf = [];
    function flushPara() {
      if (!paraBuf.length) return;
      parts.push('<p>' + escapeHtml(paraBuf.join('\n')) + '</p>');
      paraBuf = [];
    }
    lines.forEach(function (line) {
      const mdImg = parseMarkdownImage(line);
      if (mdImg) {
        flushPara();
        parts.push(imageEmbedHtml(mdImg.src, mdImg.alt));
        return;
      }
      if (isTweetUrl(line)) {
        flushPara();
        const url = line.replace(/[.,;:!?)]+$/, '');
        tweetUrls.push(url);
        parts.push(tweetEmbedHtml(url));
        return;
      }
      if (isImageUrl(line)) {
        flushPara();
        const url = line.replace(/[.,;:!?)]+$/, '');
        parts.push(imageEmbedHtml(url, ''));
        return;
      }
      paraBuf.push(line);
    });
    flushPara();
  });
  return { html: '<div class="article-body">' + parts.join('') + '</div>', tweetUrls: tweetUrls };
}



function renderError(message) {
  document.getElementById('article-root').innerHTML =
    '<a href="/" class="article-back">← Back to Sixers Hoops</a>' +
    '<div class="article-state"><h2>' + escapeHtml(message) + '</h2><p>Head back to the homepage for the latest news.</p></div>';
}

function renderMore(more) {
  if (!more || !more.length) return '';
  return '<section class="more-section"><h2 class="more-title">More from the desk</h2><div class="more-list">' +
    more.map(function (a) {
      const color = CATEGORY_COLORS[a.category] || '#006bb6';
      return '<a class="more-item" href="/article/' + encodeURIComponent(a.slug || '') + '">' +
        '<span class="article-tag" style="color:' + color + ';border:1px solid ' + color + '33;background:' + color + '14;">' + escapeHtml(a.category || 'News') + '</span>' +
        '<h3 class="more-item-title">' + escapeHtml(a.title || '') + '</h3>' +
        (a.excerpt ? '<p class="more-item-excerpt">' + escapeHtml(a.excerpt) + '</p>' : '') +
        '<div class="more-item-meta">' + escapeHtml(a.author || 'Sixers Hoops Staff') + ' · ' + escapeHtml(timeAgo(toDate(a.createdAt))) + '</div>' +
        '</a>';
    }).join('') + '</div></section>';
}

function renderArticle(a, more) {
  // Private articles are not shown publicly
  if (a.visibility === 'private') {
    document.title = 'Private article — Sixers Hoops';
    document.getElementById('article-root').innerHTML =
      '<a href="/" class="article-back">&larr; Back to Sixers Hoops</a>' +
      '<div class="article-locked">' +
        '<h1>This article is private</h1>' +
        '<p>It is not available on the public site.</p>' +
      '</div>';
    return;
  }

  const color = CATEGORY_COLORS[a.category] || '#006bb6';
  const dateObj = a.createdAt ? toDate(a.createdAt) : null;
  const date = dateObj ? dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const author = 'By: ' + (a.author || 'SixersHoops');
  document.title = a.title + ' — Sixers Hoops';

  function setMeta(name, content, prop) {
    const sel = prop ? 'meta[property="' + name + '"]' : 'meta[name="' + name + '"]';
    let el = document.querySelector(sel);
    if (!el) { el = document.createElement('meta'); if (prop) el.setAttribute('property', name); else el.setAttribute('name', name); document.head.appendChild(el); }
    el.setAttribute('content', content);
  }
  const desc = a.excerpt || (a.intro ? a.intro.slice(0, 155) : 'Sixers Hoops — Philadelphia 76ers news and analysis.');
  const canonical = 'https://sixershoops.com/article/' + encodeURIComponent(a.slug || '');
  setMeta('description', desc);
  setMeta('og:title', a.title + ' — Sixers Hoops', true);
  setMeta('og:description', desc, true);
  setMeta('og:url', canonical, true);
  setMeta('og:type', 'article', true);
  setMeta('twitter:card', a.imageUrl ? 'summary_large_image' : 'summary');
  setMeta('twitter:title', a.title + ' — Sixers Hoops');
  setMeta('twitter:description', desc);
  if (a.imageUrl) {
    setMeta('og:image', a.imageUrl, true);
    setMeta('twitter:image', a.imageUrl);
  }
  let canonEl = document.querySelector('link[rel="canonical"]');
  if (!canonEl) { canonEl = document.createElement('link'); canonEl.setAttribute('rel', 'canonical'); document.head.appendChild(canonEl); }
  canonEl.setAttribute('href', canonical);

  let html = '<a href="/" class="article-back">← Back to Sixers Hoops</a>';

  html += '<div class="article-header">';
  html += '<span class="article-tag" style="color:' + color + ';border:1px solid ' + color + '33;background:' + color + '14;">' + escapeHtml(a.category || 'News') + '</span>';
  html += '<h1 class="article-title">' + escapeHtml(a.title) + '</h1>';
  html += '<div class="article-meta">' +
    '<span>' + escapeHtml(author) + '</span>' +
    '<span class="meta-dot">·</span>' +
    '<span>' + escapeHtml(date) + '</span>' +
    '<span class="meta-dot">·</span>' +
    '<span>' + escapeHtml(readMinutes(a)) + '</span>' +
  '</div>';
  if (a.excerpt) html += '<p class="article-excerpt">' + escapeHtml(a.excerpt) + '</p>';
  html += '</div>';
  html += '<div class="article-divider" aria-hidden="true"></div>';

  if (a.imageUrl) {
    html += '<figure class="article-hero"><img src="' + escapeHtml(a.imageUrl) + '" alt="' + escapeHtml(a.title) + '"></figure>';
    if (a.imageCredit) html += '<p class="article-photo-credit">' + escapeHtml(a.imageCredit) + '</p>';
  }

  var bodyParsed = renderBodyHtml(a.intro || '');
  html += bodyParsed.html;
  // Primary tweet field only if not already embedded in the body
  if (a.tweetUrl && bodyParsed.tweetUrls.indexOf(a.tweetUrl) === -1) {
    html += tweetEmbedHtml(a.tweetUrl);
  }

  const grades = (a.grades || []).filter(function (g) { return g.grade && g.grade !== 'DNP'; });
  if (grades.length) {
    html += '<div class="grades-section"><h2 class="grades-heading">Player Grades</h2>';
    grades.forEach(function (g) {
      const gColor = GRADE_COLORS[g.grade] || '#006bb6';
      html += '<div class="grade-card">';
      html += '<div class="grade-pill" style="background:' + gColor + ';color:#fff;">' + escapeHtml(g.grade) + '</div>';
      html += '<div class="grade-card-body">';
      html += '<h3 class="grade-card-name">' + escapeHtml(g.name) + '</h3>';
      if (g.stats) html += '<p class="grade-card-stats">' + escapeHtml(g.stats) + '</p>';
      if (g.analysis) html += '<p class="grade-card-analysis">' + escapeHtml(g.analysis) + '</p>';
      if (g.tweetUrl) html += '<div class="grade-card-tweet">' + tweetEmbedHtml(g.tweetUrl) + '</div>';
      html += '</div></div>';
    });
    html += '</div>';
  }

  if (a.closing) {
    html += '<aside class="bottom-line"><span class="bottom-line-label">Bottom Line</span><p>' + escapeHtml(a.closing) + '</p></aside>';
  }

  html += renderMore(more);

  document.getElementById('article-root').innerHTML = html;

  var needsWidgets = !!(a.tweetUrl || bodyParsed.tweetUrls.length || grades.some(function (g) { return g.tweetUrl; }));
  if (needsWidgets) {
    if (window.twttr && window.twttr.widgets) {
      window.twttr.widgets.load();
    } else {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://platform.twitter.com/widgets.js';
      s.charset = 'utf-8';
      document.body.appendChild(s);
    }
  }
}

function loadArticle() {
  const slug = getSlugFromPath();
  if (!slug) { renderError('Article not found'); return; }
  waitForDb(function () {
    window.db.collection(NEWS_COLLECTION).where('slug', '==', slug).limit(1).get()
      .then(function (snap) {
        if (snap.empty) { renderError('Article not found'); return; }
        const article = Object.assign({ id: snap.docs[0].id }, snap.docs[0].data());
        if (!isPublished(article)) { renderError('Article not found'); return; }
        window.db.collection(NEWS_COLLECTION).orderBy('createdAt', 'desc').limit(8).get()
          .then(function (moreSnap) {
            const more = moreSnap.docs
              .map(function (d) { return Object.assign({ id: d.id }, d.data()); })
              .filter(function (x) { return isPublished(x) && x.slug && x.slug !== article.slug; })
              .slice(0, 3);
            renderArticle(article, more);
          })
          .catch(function () { renderArticle(article, []); });
      })
      .catch(function (err) {
        console.error(err);
        renderError("Couldn't load this article right now");
      });
  });
}

loadArticle();
</script>
</body>
</html>
