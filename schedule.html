<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Philadelphia 76ers Schedule | SixersHoops</title>
  <meta name="description" content="2026-27 Philadelphia 76ers full schedule with streams, filters, and results."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="navbar-styles.css"/>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1V9Q0MNEM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T1V9Q0MNEM');
  </script>
  <style>
    :root {
      --navy:#001a57; --sixers-blue:#006BB6; --sixers-red:#ED174C;
      --cream:#ffffff; --ink:#0d0f1a; --mid:#64748b; --mid-2:#94a3b8;
      --border-light:#e4e8f0; --card-bg:#ffffff; --surface-soft:#f6f8fc;
      --green:#16a34a; --red:#dc2626;
    }
    html[data-theme="dark"] {
      --cream:#0b0f1a; --ink:#f1f5f9; --mid:#94a3b8; --mid-2:#64748b;
      --border-light:#243044; --card-bg:#121826; --surface-soft:#172033;
    }
    *,*::before,*::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body,html {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: 'Lexend', system-ui, sans-serif; line-height: 1.5;
    }
    body { padding-top: 64px; }
    .hero-inner { max-width: 860px; margin: 0 auto; padding: 4.5rem 2rem 3rem; text-align: center; }
    .hero-title-top, .hero-title-bottom {
      font-size: clamp(2.4rem,6vw,4.5rem); font-weight: 700; line-height: .95; margin: 0;
    }
    .hero-title-bottom { color: var(--sixers-blue); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
    .section-label {
      font-weight: 500; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase;
      color: var(--mid); display: flex; align-items: center; gap: .7rem; margin: 0 0 1rem;
    }
    .section-label .line { flex: 1; height: 1px; background: var(--border-light); }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
    .metric {
      background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 12px;
      padding: 1.1rem 1.2rem; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .metric .k { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mid); font-weight: 600; display: block; margin-bottom: .45rem; }
    .metric .v { font-weight: 700; font-size: 1.25rem; display: block; }
    .metric .sub { font-size: .65rem; color: var(--mid-2); margin-top: .35rem; display: block; }
    .metric.blue .v { color: var(--sixers-blue); }
    .metric.red .v { color: var(--sixers-red); }
    .metric.green .v { color: var(--green); }
    .injury-line { font-size: .82rem; color: var(--mid); margin: 0 0 1.4rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; }
    .chip, .mini-btn {
      border: 1px solid var(--border-light); background: var(--card-bg); color: var(--ink);
      border-radius: 999px; padding: .35rem .75rem; font-size: .75rem; font-weight: 600; cursor: pointer;
    }
    .chip.active { background: rgba(0,107,182,.12); color: var(--sixers-blue); border-color: rgba(0,107,182,.3); }
    #month-nav { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.2rem; }
    .month-section {
      background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 12px;
      overflow: hidden; margin-bottom: 1.5rem;
    }
    .month-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light); background: var(--surface-soft); display: flex; align-items: center; gap: .6rem; }
    .month-header::before { content: ''; width: 4px; height: 18px; background: var(--sixers-blue); border-radius: 2px; }
    .month-title { font-weight: 600; font-size: .95rem; margin: 0; }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mid); padding: .85rem 1.25rem; border-bottom: 1px solid var(--border-light); }
    td { padding: .9rem 1.25rem; border-bottom: 1px solid var(--border-light); font-size: .88rem; vertical-align: top; }
    tr.next-row td { background: rgba(0,107,182,.07); }
    tr.flash td { outline: 2px solid var(--sixers-blue); }
    .game-info { display: flex; align-items: center; gap: .55rem; font-weight: 600; flex-wrap: wrap; }
    .opponent-logo { width: 28px; height: 28px; object-fit: contain; }
    .opp-rec, .series { font-size: .72rem; color: var(--mid); font-weight: 500; }
    .series { margin: .35rem 0 0; }
    .date-cell { color: var(--mid); white-space: nowrap; }
    .win-result { color: var(--green); font-weight: 700; }
    .loss-result { color: var(--red); font-weight: 700; }
    .badge { display: inline-block; font-size: .58rem; letter-spacing: .08em; font-weight: 600; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; border: 1px solid var(--border-light); }
    .badge.upcoming { background: rgba(0,107,182,.08); color: var(--sixers-blue); }
    .badge.final { color: var(--mid-2); }
    .badge.live { background: rgba(237,23,76,.1); color: var(--sixers-red); animation: pulse 2s infinite; }
    .net-pill { display: inline-block; font-size: .65rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin: 0 4px 4px 0; }
    .net-nbc { background: #111; color: #fff; }
    .net-espn { background: #d00; color: #fff; }
    .net-abc { background: #1a1aff; color: #fff; }
    .net-amazon { background: #232f3e; color: #ff9900; }
    .net-tnt { background: #000; color: #fff; }
    .net-peacock { background: #000; color: #11b5e4; }
    .net-local { background: var(--surface-soft); color: var(--ink); }
    .flag { font-size: .62rem; font-weight: 700; color: var(--sixers-red); margin-right: .4rem; }
    .mini-link { display: inline-block; font-size: .72rem; color: var(--sixers-blue); margin-right: .5rem; text-decoration: none; }
    .actions-cell { white-space: nowrap; }
    .wl { display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 3px; font-size: .58rem; font-weight: 800; margin-right: 3px; }
    .wl.w { background: var(--green); color: #fff; }
    .wl.l { background: var(--red); color: #fff; }
    .empty-note { color: var(--mid); border: 1px dashed var(--border-light); border-radius: 12px; padding: 1rem; }
    .wall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .6rem; padding: 1rem; }
    .wall-card { border: 1px solid var(--border-light); border-radius: 10px; padding: .7rem; background: var(--surface-soft); }
    .wall-card.win { border-color: rgba(22,163,74,.4); }
    .wall-card.loss { border-color: rgba(220,38,38,.4); }
    .wall-date { font-size: .72rem; color: var(--mid); }
    .wall-opp { font-weight: 700; margin: .2rem 0; }
    .loader { text-align: center; padding: 4rem 1rem; color: var(--mid); }
    .loader-spinner { border: 3px solid var(--border-light); border-top: 3px solid var(--sixers-blue); border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .55; } }
    @media (max-width: 720px) {
      .wrap { padding: 1rem 1.1rem 3rem; }
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
    @media print {
      body { padding-top: 0; }
      #controls, script, .hero { display: none !important; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <header class="hero">
    <div class="hero-inner">
      <p class="hero-title-top">SIXERS</p>
      <p class="hero-title-bottom">SCHEDULE</p>
    </div>
  </header>

  <div class="wrap">
    <div class="section-label"><span>Season Snapshot</span><span class="line"></span></div>
    <div class="metric-grid">
      <div class="metric blue">
        <span class="k">Record</span>
        <span class="v" id="stat-record">--</span>
        <span class="sub" id="stat-splits">Home 0-0 · Away 0-0</span>
      </div>
      <div class="metric">
        <span class="k">Games Played</span>
        <span class="v" id="stat-played">--</span>
        <span class="sub">Regular season of 82</span>
      </div>
      <div class="metric">
        <span class="k">Streak / Last 10</span>
        <span class="v" id="stat-streak">--</span>
        <span class="sub" id="stat-last10">—</span>
      </div>
      <div class="metric red">
        <span class="k">Next Game</span>
        <span class="v" id="stat-next">--</span>
        <span class="sub" id="stat-next-date">TBD</span>
        <span class="sub" id="stat-countdown"></span>
      </div>
      <div class="metric green">
        <span class="k">Win %</span>
        <span class="v" id="stat-pct">--</span>
        <span class="sub">Regular season</span>
      </div>
    </div>
    <p class="injury-line" id="injury-note">Checking injury report…</p>

    <div class="section-label"><span>Game Log</span><span class="line"></span></div>
    <div class="controls" id="controls">
      <button class="chip active" data-tab="2">Regular</button>
      <button class="chip" data-tab="1">Preseason</button>
      <button class="chip" data-tab="3">Playoffs</button>
      <button class="chip active" data-view="all">All</button>
      <button class="chip" data-view="home">Home</button>
      <button class="chip" data-view="away">Away</button>
      <button class="chip active" data-tv="all">Any TV</button>
      <button class="chip" data-tv="national">National TV</button>
      <button class="chip" data-tv="local">Local / TBD</button>
      <button class="chip active" data-mode="list">List</button>
      <button class="chip" data-mode="grid">Wall</button>
      <button class="chip" id="jump-next">Next game</button>
      <button class="chip" id="theme-toggle">Dark mode</button>
      <button class="chip" id="copy-link">Copy link</button>
    </div>
    <div id="month-nav"></div>

    <main id="schedule">
      <div class="loader">
        <div class="loader-spinner"></div>
        <p>Fetching latest schedule...</p>
      </div>
    </main>
  </div>
  <script src="schedule.js"></script>
</body>
</html>
