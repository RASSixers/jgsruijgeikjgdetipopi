<script>

function ensureAdsbygoogle() {
  try {
    if (document.querySelector('script[src*="adsbygoogle.js"]')) return;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8046070602394287';
    s.crossOrigin = 'anonymous';
    (document.head || document.documentElement).appendChild(s);
  } catch (e) {}
}
ensureAdsbygoogle();

const NEWS_COLLECTION = 'editorial_articles';
const CATEGORY_COLORS = {'Player Grades':'#1e7d46','Analysis':'#006BB6','Opinion':'#b06b00','Preview':'#ED174C','Recap':'#475569','News':'#0077cc'};
const GRADE_COLORS = {'A+':'#1a6b3c','A':'#1e7d46','A-':'#2d8f56','B+':'#006BB6','B':'#0077cc','B-':'#2a85d0','C+':'#b06b00','C':'#c27800','D+':'#b83232','D':'#a02828','F':'#7a1a1a','INC':'#6b21a8'};

function waitForDb(cb, tries) {
  tries = tries || 0;
  if (window.db) { cb(); return; }
  if (tries > 60) { renderError('Could not connect right now. Please refresh and try again.'); return; }
  setTimeout(function () { waitForDb(cb, tries + 1); }, 250);
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getSlugFromPath() {
  var path = (window.location.pathname || '').replace(/\/+$/, '');
  var fromPath = path.match(/^\/article\/(.+)$/i);
  if (fromPath && fromPath[1] && fromPath[1].toLowerCase() !== 'article.html' && fromPath[1].toLowerCase() !== 'articles.html') {
    return decodeURIComponent(fromPath[1]);
  }
  return new URLSearchParams(window.location.search).get('slug') || null;
}

function toDate(ts) {
  if (!ts) return null;
  if (ts.toDate) return ts.toDate();
  return new Date(ts);
}

function timeAgo(date) {
  if (!date) return '';
  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
  if (seconds < 60) return 'Just now';
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return mins + 'm ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h ago';
  const days = Math.floor(hours / 24);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + 'd ago';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function readMinutes(a) {
  const text = [a.excerpt, a.intro, a.closing].join(' ') +
    (a.grades || []).map(function (g) { return (g.analysis || '') + ' ' + (g.stats || ''); }).join(' ');
  const words = String(text).trim() ? String(text).trim().split(/\s+/).length : 0;
  return Math.max(1, Math.round(words / 220)) + ' min read';
}

function isPublished(a) {
  if (a && a.status === 'draft') return false;
  return !a.status || a.status === 'published';
}

function tweetEmbedHtml(url) {
  const safeUrl = escapeHtml(url);
  return (
    '<div class="tweet-embed-wrap">' +
      '<blockquote class="twitter-tweet"><a href="' + safeUrl + '"></a></blockquote>' +
      '<noscript><div class="tweet-fallback-card">View this post on <a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">X / Twitter</a>.</div></noscript>' +
    '</div>'
  );
}
function isTweetUrl(line) {
  return /^https?:\/\/(?:www\.)?(?:x\.com|twitter\.com)\/[^\s]+\/status\/\d+/i.test(String(line || '').trim());
}
function isImageUrl(line) {
  const s = String(line || '').trim();
  // Direct image URLs or common CDNs
  if (/^https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif)(?:\?\S*)?$/i.test(s)) return true;
  if (/^https?:\/\/(?:i\.imgur\.com|images\.unsplash\.com|cdn\.nba\.com|a\.espncdn\.com)\S+/i.test(s)) return true;
  return false;
}
function parseMarkdownImage(line) {
  const m = String(line || '').trim().match(/^!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)$/);
  if (!m) return null;
  return { alt: m[1] || '', src: m[2] };
}
function imageEmbedHtml(src, alt) {
  const safeSrc = escapeHtml(src);
  const safeAlt = escapeHtml(alt || '');
  return (
    '<figure class="article-inline-img">' +
      '<img src="' + safeSrc + '" alt="' + safeAlt + '" loading="lazy">' +
      (safeAlt ? '<figcaption>' + safeAlt + '</figcaption>' : '') +
    '</figure>'
  );
}
/** Parse article body into paragraphs, tweet embeds, and images. */
function renderBodyHtml(raw) {
  const text = String(raw || '').replace(/\r\n/g, '\n').trim();
  if (!text) return { html: '', tweetUrls: [] };
  const blocks = text.split(/\n{2,}/);
  const tweetUrls = [];
  const parts = [];
  blocks.forEach(function (block) {
    const lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return;
    // Single-line special blocks
    if (lines.length === 1) {
      const line = lines[0];
      const mdImg = parseMarkdownImage(line);
      if (mdImg) {
        parts.push(imageEmbedHtml(mdImg.src, mdImg.alt));
        return;
      }
      if (isTweetUrl(line)) {
        const url = line.replace(/[.,;:!?)]+$/, '');
        tweetUrls.push(url);
        parts.push(tweetEmbedHtml(url));
        return;
      }
      if (isImageUrl(line)) {
        const url = line.replace(/[.,;:!?)]+$/, '');
        parts.push(imageEmbedHtml(url, ''));
        return;
      }
    }
    // Multi-line: check each line for embeds mixed with text
    let paraBuf = [];
    function flushPara() {
      if (!paraBuf.length) return;
      parts.push('<p>' + escapeHtml(paraBuf.join('\n')) + '</p>');
      paraBuf = [];
    }
    lines.forEach(function (line) {
      const mdImg = parseMarkdownImage(line);
      if (mdImg) {
        flushPara();
        parts.push(imageEmbedHtml(mdImg.src, mdImg.alt));
        return;
      }
      if (isTweetUrl(line)) {
        flushPara();
        const url = line.replace(/[.,;:!?)]+$/, '');
        tweetUrls.push(url);
        parts.push(tweetEmbedHtml(url));
        return;
      }
      if (isImageUrl(line)) {
        flushPara();
        const url = line.replace(/[.,;:!?)]+$/, '');
        parts.push(imageEmbedHtml(url, ''));
        return;
      }
      paraBuf.push(line);
    });
    flushPara();
  });
  return { html: '<div class="article-body">' + parts.join('') + '</div>', tweetUrls: tweetUrls };
}



function renderError(message) {
  document.getElementById('article-root').innerHTML =
    '<a href="/" class="article-back">← Back to Sixers Hoops</a>' +
    '<div class="article-state"><h2>' + escapeHtml(message) + '</h2><p>Head back to the homepage for the latest news.</p></div>';
}

function renderMore(more) {
  if (!more || !more.length) return '';
  return '<section class="more-section"><h2 class="more-title">More from the desk</h2><div class="more-list">' +
    more.map(function (a) {
      const color = CATEGORY_COLORS[a.category] || '#006bb6';
      return '<a class="more-item" href="/article/' + encodeURIComponent(a.slug || '') + '">' +
        '<span class="article-tag" style="color:' + color + ';border:1px solid ' + color + '33;background:' + color + '14;">' + escapeHtml(a.category || 'News') + '</span>' +
        '<h3 class="more-item-title">' + escapeHtml(a.title || '') + '</h3>' +
        (a.excerpt ? '<p class="more-item-excerpt">' + escapeHtml(a.excerpt) + '</p>' : '') +
        '<div class="more-item-meta">By: ' + escapeHtml(a.author || 'SixersHoops') + ' · ' + escapeHtml(timeAgo(toDate(a.createdAt))) + '</div>' +
        '</a>';
    }).join('') + '</div></section>';
}

function renderArticle(a, more) {
  // Private articles are not shown publicly
  if (a.visibility === 'private') {
    document.title = 'Private article — Sixers Hoops';
    document.getElementById('article-root').innerHTML =
      '<a href="/" class="article-back">&larr; Back to Sixers Hoops</a>' +
      '<div class="article-locked">' +
        '<h1>This article is private</h1>' +
        '<p>It is not available on the public site.</p>' +
      '</div>';
    return;
  }

  const color = CATEGORY_COLORS[a.category] || '#006bb6';
  const dateObj = a.createdAt ? toDate(a.createdAt) : null;
  const date = dateObj ? dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
  const author = 'By: ' + (a.author || 'SixersHoops');
  document.title = a.title + ' — Sixers Hoops';

  function setMeta(name, content, prop) {
    const sel = prop ? 'meta[property="' + name + '"]' : 'meta[name="' + name + '"]';
    let el = document.querySelector(sel);
    if (!el) { el = document.createElement('meta'); if (prop) el.setAttribute('property', name); else el.setAttribute('name', name); document.head.appendChild(el); }
    el.setAttribute('content', content);
  }
  const desc = a.excerpt || (a.intro ? a.intro.slice(0, 155) : 'Sixers Hoops — Philadelphia 76ers news and analysis.');
  const canonical = 'https://sixershoops.com/article/' + encodeURIComponent(a.slug || '');
  setMeta('description', desc);
  setMeta('og:title', a.title + ' — Sixers Hoops', true);
  setMeta('og:description', desc, true);
  setMeta('og:url', canonical, true);
  setMeta('og:type', 'article', true);
  setMeta('twitter:card', a.imageUrl ? 'summary_large_image' : 'summary');
  setMeta('twitter:title', a.title + ' — Sixers Hoops');
  setMeta('twitter:description', desc);
  if (a.imageUrl) {
    setMeta('og:image', a.imageUrl, true);
    setMeta('twitter:image', a.imageUrl);
  }
  let canonEl = document.querySelector('link[rel="canonical"]');
  if (!canonEl) { canonEl = document.createElement('link'); canonEl.setAttribute('rel', 'canonical'); document.head.appendChild(canonEl); }
  canonEl.setAttribute('href', canonical);

  let html = '<a href="/" class="article-back">← Back to Sixers Hoops</a>';

  html += '<div class="article-header">';
  html += '<span class="article-tag" style="color:' + color + ';border:1px solid ' + color + '33;background:' + color + '14;">' + escapeHtml(a.category || 'News') + '</span>';
  html += '<h1 class="article-title">' + escapeHtml(a.title) + '</h1>';
  html += '<div class="article-meta">' +
    '<span>' + escapeHtml(author) + '</span>' +
    '<span class="meta-dot">·</span>' +
    '<span>' + escapeHtml(date) + '</span>' +
    '<span class="meta-dot">·</span>' +
    '<span>' + escapeHtml(readMinutes(a)) + '</span>' +
  '</div>';
  if (a.excerpt) html += '<p class="article-excerpt">' + escapeHtml(a.excerpt) + '</p>';
  html += '</div>';
  html += '<div class="article-divider" aria-hidden="true"></div>';

  if (a.imageUrl) {
    html += '<figure class="article-hero"><img src="' + escapeHtml(a.imageUrl) + '" alt="' + escapeHtml(a.title) + '"></figure>';
    if (a.imageCredit) html += '<p class="article-photo-credit">' + escapeHtml(a.imageCredit) + '</p>';
  }

  // Body: prefer intro, fall back to body/content for older docs
  var bodySource = a.intro || a.body || a.content || '';
  var bodyParsed = renderBodyHtml(bodySource);
  html += bodyParsed.html;
  if (a.tweetUrl && bodyParsed.tweetUrls.indexOf(a.tweetUrl) === -1) {
    html += tweetEmbedHtml(a.tweetUrl);
  }

  var allGrades = Array.isArray(a.grades) ? a.grades.filter(function (g) {
    return g && (g.name || g.player) && g.grade;
  }) : [];
  var graded = allGrades.filter(function (g) {
    var gr = String(g.grade || '').toUpperCase();
    return gr && gr !== 'DNP';
  });
  var dnps = allGrades.filter(function (g) {
    return String(g.grade || '').toUpperCase() === 'DNP';
  });

  function gradeCardHtml(g, muted) {
    var name = g.name || g.player || 'Player';
    var gr = String(g.grade || '');
    var gColor = GRADE_COLORS[gr] || (gr === 'DNP' ? '#94a3b8' : '#006bb6');
    var out = '<div class="grade-card' + (muted ? ' grade-muted' : '') + '">';
    out += '<div class="grade-pill" style="background:' + gColor + ';">' + escapeHtml(gr) + '</div>';
    out += '<div class="grade-card-body">';
    out += '<h3 class="grade-card-name">' + escapeHtml(name) + '</h3>';
    if (g.stats) out += '<p class="grade-card-stats">' + escapeHtml(g.stats) + '</p>';
    if (g.analysis) out += '<p class="grade-card-analysis">' + escapeHtml(g.analysis) + '</p>';
    if (g.tweetUrl) out += '<div class="grade-card-tweet">' + tweetEmbedHtml(g.tweetUrl) + '</div>';
    out += '</div></div>';
    return out;
  }

  if (graded.length || dnps.length) {
    html += '<div class="grades-section"><h2 class="grades-heading">Player Grades</h2>';
    if (graded.length) {
      graded.forEach(function (g) { html += gradeCardHtml(g, false); });
    } else {
      html += '<p class="grades-empty">No letter grades were entered for this game.</p>';
    }
    if (dnps.length) {
      html += '<div class="grades-subhead">Did not play</div>';
      dnps.forEach(function (g) { html += gradeCardHtml(g, true); });
    }
    html += '</div>';
  } else if (String(a.category || '') === 'Player Grades') {
    html += '<div class="grades-section"><h2 class="grades-heading">Player Grades</h2>';
    html += '<p class="grades-empty">Grades for this article are not available yet.</p></div>';
  }

  var grades = graded; // for tweet widget detection below

  if (a.closing) {
    html += '<aside class="bottom-line"><span class="bottom-line-label">Bottom Line</span><p>' + escapeHtml(a.closing) + '</p></aside>';
  }

  html += renderMore(more);

  document.getElementById('article-root').innerHTML = html;

  var gradeTweets = (allGrades || []).some(function (g) { return g && g.tweetUrl; });
  var needsWidgets = !!(a.tweetUrl || (bodyParsed && bodyParsed.tweetUrls && bodyParsed.tweetUrls.length) || gradeTweets);
  if (needsWidgets) {
    function loadTw() {
      try {
        if (window.twttr && window.twttr.widgets) {
          if (window.twttr.ready) window.twttr.ready(function () { window.twttr.widgets.load(); });
          else window.twttr.widgets.load();
        }
      } catch (e) {}
    }
    if (window.twttr && window.twttr.widgets) loadTw();
    else {
      var existing = document.getElementById('twitter-wjs');
      if (!existing) {
        var s = document.createElement('script');
        s.id = 'twitter-wjs';
        s.async = true;
        s.src = 'https://platform.twitter.com/widgets.js';
        s.charset = 'utf-8';
        s.onload = loadTw;
        document.body.appendChild(s);
      } else {
        existing.addEventListener('load', loadTw);
        setTimeout(loadTw, 600);
      }
    }
    setTimeout(loadTw, 1200);
  }
}

function loadArticle() {
  const slug = getSlugFromPath();
  if (!slug) { renderError('Article not found'); return; }
  waitForDb(function () {
    window.db.collection(NEWS_COLLECTION).where('slug', '==', slug).limit(1).get()
      .then(function (snap) {
        if (snap.empty) { renderError('Article not found'); return; }
        const article = Object.assign({ id: snap.docs[0].id }, snap.docs[0].data());
        if (!isPublished(article)) { renderError('Article not found'); return; }
        window.db.collection(NEWS_COLLECTION).orderBy('createdAt', 'desc').limit(8).get()
          .then(function (moreSnap) {
            const more = moreSnap.docs
              .map(function (d) { return Object.assign({ id: d.id }, d.data()); })
              .filter(function (x) { return isPublished(x) && x.slug && x.slug !== article.slug; })
              .slice(0, 3);
            renderArticle(article, more);
          })
          .catch(function () { renderArticle(article, []); });
      })
      .catch(function (err) {
        console.error(err);
        renderError("Couldn't load this article right now");
      });
  });
}

loadArticle();
</script>
</body>
</html>
