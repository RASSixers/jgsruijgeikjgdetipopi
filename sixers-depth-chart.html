<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sixers Depth Chart | SixersHoops</title>
<meta name="description" content="Philadelphia 76ers depth chart by position with starters, rotation, and two-way players." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js"></script>
<style>
:root{
  --navy:#001a57;--navy-deep:#0b0f1a;--sixers-blue:#006bb6;--sixers-blue-dark:#0057a0;
  --sixers-red:#ed174c;--gold:#c9a84c;--cream:#fff;--ink:#0d0f1a;--mid:#64748b;
  --border-light:#e4e8f0;--card-bg:#fff;--surface-soft:#f6f8fc;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;padding-top:64px}
button{font-family:inherit}

.hero{background:var(--cream);position:relative;overflow:hidden}
.hero-inner{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:1.75rem 2rem 1.75rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-glow-blue{position:absolute;right:-120px;top:-80px;width:600px;height:500px;background:radial-gradient(ellipse at center,rgba(0,107,182,.08) 0%,transparent 70%);pointer-events:none}
.hero-glow-red{position:absolute;left:-60px;bottom:-40px;width:400px;height:300px;background:radial-gradient(ellipse at center,rgba(237,23,76,.05) 0%,transparent 70%);pointer-events:none}
.hero-title-top,.hero-title-bottom{font-size:clamp(2.4rem,6vw,4.5rem);font-weight:700;line-height:.95;letter-spacing:-.03em}
.hero-title-top{color:var(--ink)}
.hero-title-bottom{color:var(--sixers-blue)}

.wrap{max-width:1200px;margin:0 auto;padding:1.5rem 2rem 4rem}
.section-label{font-weight:500;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);display:flex;align-items:center;gap:.7rem;margin:0 0 1rem}
.section-label .line{flex:1;height:1px;background:var(--border-light)}

.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.85rem 1rem;background:var(--card-bg);border:1px solid var(--border-light);border-radius:12px;margin-bottom:1.5rem;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.filters{display:flex;gap:.35rem;flex-wrap:wrap}
.filter-btn{font-weight:500;font-size:.78rem;padding:.5rem .95rem;background:transparent;border:1px solid var(--border-light);border-radius:999px;color:var(--mid);transition:all .18s;cursor:pointer}
.filter-btn:hover{border-color:var(--sixers-blue);color:var(--sixers-blue)}
.filter-btn.active{background:var(--sixers-blue);border-color:var(--sixers-blue);color:#fff;box-shadow:0 2px 8px rgba(0,107,182,.2)}
.export-btn{margin-left:auto;font-weight:500;font-size:.78rem;padding:.55rem 1.1rem;background:var(--navy);color:#fff;border:none;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;transition:all .2s;box-shadow:0 2px 12px rgba(0,26,87,.2)}
.export-btn:hover{background:#001240;transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,26,87,.3)}

.depth-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem}
.position-column{display:flex;flex-direction:column;gap:.6rem}
.position-label{font-weight:600;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:.6rem .5rem;background:var(--ink);color:#fff;border-radius:10px;position:relative;overflow:hidden}
.position-label::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--sixers-blue),transparent)}
.player-slot{background:var(--card-bg);border:1px solid var(--border-light);border-radius:12px;padding:.85rem .75rem;text-align:center;transition:all .22s ease;position:relative;min-height:64px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03)}
.player-slot:hover{border-color:rgba(0,107,182,.25);box-shadow:0 6px 22px rgba(0,107,182,.09);transform:translateY(-2px)}
.player-slot.starter{border-color:rgba(0,107,182,.5);box-shadow:0 4px 14px -6px rgba(0,107,182,.25)}
.player-slot.starter::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--sixers-blue);border-radius:12px 12px 0 0}
.player-slot.twoway{border-style:dashed;border-color:var(--gold);background:linear-gradient(180deg,#fff,#fffaf0)}
.player-name{font-weight:600;font-size:.92rem;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.player-slot.starter .player-name{color:var(--sixers-blue)}
.slot-badge{position:absolute;top:-8px;left:50%;transform:translateX(-50%);color:#fff;font-size:.55rem;font-weight:600;letter-spacing:.12em;padding:3px 9px;border-radius:999px;text-transform:uppercase;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.slot-badge.starter{background:var(--sixers-blue)}
.slot-badge.twoway{background:var(--gold);color:#1a1306}

.legend{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;margin-top:1.5rem;padding:1rem;background:var(--surface-soft);border:1px solid var(--border-light);border-radius:12px}
.legend-item{display:flex;align-items:center;gap:.5rem;font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mid)}
.legend-swatch{width:14px;height:14px;border-radius:4px}
.legend-swatch.starter{background:#fff;border:1.5px solid var(--sixers-blue)}
.legend-swatch.bench{background:#fff;border:1px solid var(--border-light)}
.legend-swatch.twoway{background:#fffaf0;border:1.5px dashed var(--gold)}

.modal-overlay{position:fixed;inset:0;z-index:1100;background:rgba(13,15,26,.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border:1px solid var(--border-light);border-radius:14px;box-shadow:0 24px 60px rgba(13,15,26,.25);padding:1.5rem;text-align:center}
.modal-actions{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.modal-btn{font-weight:500;font-size:.78rem;padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;border:1px solid var(--border-light);background:#fff;color:var(--ink);transition:all .18s}
.modal-btn:hover{border-color:var(--sixers-blue);color:var(--sixers-blue)}
.modal-btn.primary{background:var(--sixers-blue);color:#fff;border-color:var(--sixers-blue)}
.modal-btn.primary:hover{background:var(--sixers-blue-dark)}

.offscreen{position:fixed;left:-10000px;top:0;pointer-events:none}
.social-export{width:1200px;background:#fff;font-family:"Lexend",system-ui,sans-serif;color:var(--ink)}
.social-topbar{height:8px;background:linear-gradient(90deg,var(--sixers-blue) 0%,#1e90d8 50%,var(--sixers-red) 100%)}
.social-inner{padding:56px 60px 48px}
.social-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid #e6eaf2}
.social-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.social-eyebrow .pulse{width:8px;height:8px;border-radius:50%;background:var(--sixers-red)}
.social-eyebrow .label{font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mid)}
.social-title h1{font-size:72px;font-weight:700;line-height:.95;letter-spacing:-.03em;color:var(--ink)}
.social-title h1 .accent{color:var(--sixers-blue)}
.social-branding{text-align:right;padding-top:6px}
.social-branding .domain{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.08em;text-transform:uppercase}
.social-branding .accent-bar{width:42px;height:3px;background:var(--sixers-blue);margin:14px 0 0 auto;border-radius:2px}
.social-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.social-col{display:flex;flex-direction:column;gap:10px}
.social-pos-label{text-align:center;padding:14px 8px;border-radius:10px;font-weight:700;font-size:18px;color:#fff;text-transform:uppercase;letter-spacing:.2em;background:var(--navy)}
.social-player{position:relative;background:#fff;border:1px solid #e6eaf2;padding:18px 10px;border-radius:10px;text-align:center;font-weight:600;font-size:16px;color:var(--ink);min-height:64px;display:flex;align-items:center;justify-content:center}
.social-player.starter{border:1.5px solid var(--sixers-blue);color:var(--sixers-blue);box-shadow:0 4px 14px -8px rgba(0,107,182,.4)}
.social-player.starter::before{content:'';position:absolute;left:0;top:12%;bottom:12%;width:3px;background:var(--sixers-blue);border-radius:0 2px 2px 0}
.social-player.twoway{border:1.5px dashed var(--gold);background:#fffaf0;color:#6b4f10;font-size:14px}
.social-footer{margin-top:36px;padding-top:22px;border-top:1px solid #e6eaf2;text-align:center;font-size:13px;font-weight:600;color:var(--mid);letter-spacing:.18em;text-transform:uppercase}

@media (max-width:1024px){.depth-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.depth-grid{grid-template-columns:repeat(2,1fr)}.toolbar{flex-direction:column;align-items:stretch}.export-btn{margin-left:0;justify-content:center}}
@media (max-width:420px){.depth-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="nav.js"></script>
<header class="hero">
  <div class="hero-glow-blue"></div>
  <div class="hero-glow-red"></div>
  <div class="hero-inner">
    <h1 class="hero-title-top">SIXERS</h1>
    <h1 class="hero-title-bottom">DEPTH CHART</h1>
  </div>
</header>

<main class="wrap">
  <div class="section-label">
    Rotation <span class="line"></span>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <button class="export-btn" id="exportBtn">↗ Export for Social</button>
  </div>

  <div class="depth-grid" id="depthGrid"></div>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch starter"></span> Starter</div>
    <div class="legend-item"><span class="legend-swatch bench"></span> Rotation</div>
  </div>
</main>

<div class="offscreen" aria-hidden="true">
  <div id="exportRoot" class="social-export">
    <div class="social-topbar"></div>
    <div class="social-inner">
      <div class="social-header">
        <div>
          <div class="social-eyebrow"><span class="pulse"></span><span class="label">2026–27 Season</span></div>
          <div class="social-title"><h1>Sixers <span class="accent">Depth Chart</span></h1></div>
        </div>
        <div class="social-branding">
          <div class="domain">SixersHoops.com</div>
          <div class="accent-bar"></div>
        </div>
      </div>
      <div class="social-grid" id="socialGrid"></div>
      <div class="social-footer">https://sixershoops.com/sixers-depth-chart</div>
    </div>
  </div>
</div>

<script>
let COLUMNS = [
  { pos:"PG", players:[] },
  { pos:"SG", players:[] },
  { pos:"SF", players:[] },
  { pos:"PF", players:[] },
  { pos:"C",  players:[] }
];

// Projected depth order (first listed = starter) for known Sixers
const DEPTH_ORDER = {
  PG: ["Tyrese Maxey", "Labaron Philon Jr.", "Caleb Love", "Duke Miles", "Jameer Nelson Jr."],
  SG: ["VJ Edgecombe", "Anfernee Simons", "Kentavious Caldwell-Pope", "Rayan Rupert"],
  SF: ["Jaylen Brown", "Justin Edwards", "Saint Thomas", "Dillon Jones"],
  PF: ["LeBron James", "Dean Wade", "Jabari Walker", "Dominick Barlow"],
  C:  ["Joel Embiid", "Adem Bona", "Ariel Hukporti", "Tacko Fall"]
};

function rankIn(list, name) {
  const i = list.indexOf(name);
  return i === -1 ? 900 : i;
}

function assignSlots(athletes) {
  const buckets = { PG: [], SG: [], SF: [], PF: [], C: [] };
  athletes.forEach(a => {
    const name = a.displayName || a.fullName;
    const pos = ((a.position && a.position.abbreviation) || "").toUpperCase();
    // ESPN often uses G / F / C only
    if (pos === "C") buckets.C.push(name);
    else if (pos === "G") {
      // split guards by depth lists
      if (DEPTH_ORDER.PG.includes(name) || (!DEPTH_ORDER.SG.includes(name) && rankIn(DEPTH_ORDER.PG, name) < rankIn(DEPTH_ORDER.SG, name))) {
        buckets.PG.push(name);
      } else if (DEPTH_ORDER.SG.includes(name)) {
        buckets.SG.push(name);
      } else {
        // default remaining guards to SG unless clearly PG list
        buckets.SG.push(name);
      }
    } else if (pos === "F") {
      if (DEPTH_ORDER.SF.includes(name) && !DEPTH_ORDER.PF.includes(name)) buckets.SF.push(name);
      else if (DEPTH_ORDER.PF.includes(name) && !DEPTH_ORDER.SF.includes(name)) buckets.PF.push(name);
      else if (DEPTH_ORDER.SF.includes(name)) buckets.SF.push(name);
      else if (DEPTH_ORDER.PF.includes(name)) buckets.PF.push(name);
      else buckets.PF.push(name);
    } else {
      buckets.PF.push(name);
    }
  });

  // Reconcile: anyone in DEPTH_ORDER for a slot moves there
  const allNames = athletes.map(a => a.displayName || a.fullName);
  ["PG","SG","SF","PF","C"].forEach(slot => {
    DEPTH_ORDER[slot].forEach(n => {
      if (!allNames.includes(n)) return;
      // remove from other buckets
      Object.keys(buckets).forEach(k => {
        buckets[k] = buckets[k].filter(x => x !== n);
      });
      buckets[slot].push(n);
    });
  });

  // Sort each bucket by DEPTH_ORDER then name
  return ["PG","SG","SF","PF","C"].map(pos => {
    const order = DEPTH_ORDER[pos] || [];
    const names = [...new Set(buckets[pos])].sort((a, b) => rankIn(order, a) - rankIn(order, b) || a.localeCompare(b));
    const players = names.map((name, i) => ({ name, type: i === 0 ? "starter" : "bench" }));
    return { pos, players };
  });
}

async function loadDepth() {
  try {
    const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/phi/roster", { cache: "no-store" });
    if (!res.ok) throw new Error("roster " + res.status);
    const data = await res.json();
    COLUMNS = assignSlots(data.athletes || []);
  } catch (err) {
    console.warn("depth roster", err);
    // Fallback projected chart
    COLUMNS = ["PG","SG","SF","PF","C"].map(pos => ({
      pos,
      players: (DEPTH_ORDER[pos] || []).map((name, i) => ({ name, type: i === 0 ? "starter" : "bench" }))
    }));
  }
}

let view = "all";
const FILTERS = [{k:"all",l:"Full Roster"},{k:"starter",l:"Starters"},{k:"bench",l:"Second Unit"}];

function renderFilters(){
  const wrap = document.getElementById("filters");
  if (!wrap) return;
  wrap.innerHTML = "";
  FILTERS.forEach(f => {
    const b = document.createElement("button");
    b.className = "filter-btn" + (view === f.k ? " active" : "");
    b.textContent = f.l;
    b.onclick = () => { view = f.k; renderFilters(); renderGrid(); };
    wrap.appendChild(b);
  });
}
function renderGrid(){
  const grid = document.getElementById("depthGrid");
  if (!grid) return;
  grid.innerHTML = "";
  COLUMNS.forEach(col => {
    const c = document.createElement("div");
    c.className = "position-column";
    c.innerHTML = `<div class="position-label">${col.pos}</div>`;
    col.players.forEach(p => {
      if (view !== "all" && view !== p.type) return;
      const slot = document.createElement("div");
      slot.className = "player-slot " + p.type;
      let badge = "";
      if (p.type === "starter") badge = `<span class="slot-badge starter">Starter</span>`;
      slot.innerHTML = badge + `<div class="player-name">${p.name}</div>`;
      c.appendChild(slot);
    });
    grid.appendChild(c);
  });
}
function renderSocial(){
  const g = document.getElementById("socialGrid");
  if (!g) return;
  g.innerHTML = "";
  COLUMNS.forEach(col=>{
    const c = document.createElement("div");
    c.className = "social-col";
    c.innerHTML = `<div class="social-pos-label">${col.pos}</div>` +
      col.players.map(p=>`<div class="social-player ${p.type==='starter'?'starter':''}">${p.name}</div>`).join("");
    g.appendChild(c);
  });
}

(async function init(){
  await loadDepth();
  renderFilters();
  renderGrid();
  renderSocial();
})();

const btn = document.getElementById("exportBtn");
if (btn) btn.onclick = async ()=>{
  btn.disabled = true; btn.textContent = "Generating…";
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    if (typeof htmlToImage === "undefined") throw new Error("export lib missing");
    const url = await htmlToImage.toPng(document.getElementById("exportRoot"),{pixelRatio:2,backgroundColor:"#ffffff",cacheBust:true});
    showModal(url);
  }catch(e){ console.error(e); alert("Couldn't generate image."); }
  finally{ btn.disabled=false; btn.textContent="↗ Export for Social"; }
};

function showModal(dataUrl){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <img src="${dataUrl}" alt="Sixers depth chart" style="max-width:100%;border-radius:10px;box-shadow:0 8px 25px rgba(0,0,0,.15)" />
      <div class="modal-actions">
        <button class="modal-btn primary" id="dl">Download Image</button>
        <button class="modal-btn" id="cp">Copy to Clipboard</button>
        <button class="modal-btn" id="cl">Close</button>
      </div>
    </div>`;
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  overlay.querySelector("#cl").onclick = ()=>overlay.remove();
  overlay.querySelector("#dl").onclick = ()=>{
    const a = document.createElement("a"); a.href=dataUrl; a.download="sixers-depth-chart.png"; a.click();
  };
  const cp = overlay.querySelector("#cp");
  cp.onclick = async ()=>{
    try{
      const blob = await (await fetch(dataUrl)).blob();
      await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
      cp.textContent = "Copied!"; setTimeout(()=>cp.textContent="Copy to Clipboard",1800);
    }catch{ cp.textContent="Copy failed"; setTimeout(()=>cp.textContent="Copy to Clipboard",1800); }
  };
  document.addEventListener("keydown", function esc(e){ if(e.key==="Escape"){overlay.remove();document.removeEventListener("keydown",esc);} });
}
</script>

</body>
</html>
