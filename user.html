            }

            async function fetchNotifs() {
              try {
                return await db.collection('notifications').where('recipientId','==',myUid).orderBy('createdAt','desc').limit(40).get();
              } catch (e) {
                // Fallback if composite index missing or mixed timestamp types
                return await db.collection('notifications').where('recipientId','==',myUid).limit(40).get();
              }
            }
            fetchNotifs()
              .then(snap => {
                let notifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                notifs.sort((a,b) => {
                  const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
                  const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);
                  return tb - ta;
                });
                const listEl = document.getElementById('notifList');
                if (!listEl) return;
                if (!notifs.length) { listEl.innerHTML = `<div class="empty-state"><p>No notifications yet</p></div>`; return; }

                const unread = notifs.filter(n => !n.read).length;
                const countEl = document.getElementById('notif-panel-count');
                if (countEl && unread > 0) { countEl.classList.remove('hidden'); countEl.textContent = unread; }

                listEl.innerHTML = notifs.map(n => {
                    const iconSvg = n.type === 'like'
                        ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
                        : n.type === 'follow'
                        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
                        : n.type === 'repost' || n.type === 'quote_repost'
                        ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>`
                        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
                    const who = n.fromName || n.senderName || 'Someone';
                    // Short labels only — never show comment body
                    let action = 'interacted with your post';
                    if (n.type === 'like') action = 'liked post';
                    else if (n.type === 'follow') action = 'followed you';
                    else if (n.type === 'comment_reply' || n.type === 'post_reply_thread') action = 'replied to your comment';
                    else if (n.type === 'repost') action = 'reposted';
                    else if (n.type === 'quote_repost') action = 'quote reposted';
                    else if (n.type === 'comment' || n.type === 'post_comment' || n.type === 'reply') action = 'commented on post';
                    const href = n.link || (n.tradeId ? ('/community/p/' + encodeURIComponent(n.tradeId)) : '');
                    return `
                    <div class="notif-item ${n.read?'':'unread'}" data-id="${esc(n.id)}" data-href="${esc(href)}" style="cursor:${href?'pointer':'default'}">
                        <div class="notif-icon">${iconSvg}</div>
                        <div class="notif-text"><strong>${esc(who)}</strong> ${esc(action)}</div>
                        <div class="notif-time">${timeAgo(n.createdAt)}</div>
                    </div>`;
                }).join('');

                // Mark all as read when notifications tab is opened
                const unreadIds = notifs.filter(n => !n.read).map(n => n.id);
                if (unreadIds.length && db) {
                  Promise.all(unreadIds.map(id => db.collection('notifications').doc(id).update({ read: true }).catch(() => {})))
                    .then(() => {
                      if (window.updateNotifBadge) window.updateNotifBadge(0);
                      setTabPill('#tab-notif-count', 0);
                      setTabPill('#tab-inbox-count', 0);
                      listEl.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
                      const countEl = document.getElementById('notif-panel-count');
                      if (countEl) countEl.classList.add('hidden');
                    });
                }

                listEl.querySelectorAll('.notif-item').forEach(el => {
                  el.addEventListener('click', async () => {
                    const href = el.getAttribute('data-href');
                    if (href) location.href = href;
                  });
                });
              })
              .catch((err) => {
                console.error(err);
                const listEl = document.getElementById('notifList');
                if (listEl) listEl.innerHTML = `<div class="empty-state"><p>Could not load notifications</p></div>`;
              });
        }

        // ── Settings panel (inline, on own profile) ───────────────
        function renderSettings(ud, myUid) {
            const fc = document.getElementById('feedContent');
            if (!fc) return;
            if (!myUid || myUid !== ud._uid) {
                fc.innerHTML = `<div class="empty-state"><p>You can only edit your own settings.</p></div>`;
                return;
            }

            const photo = ud.photoURL || '';
            const initial = (ud.username || 'U').charAt(0).toUpperCase();
            const color = ud.avatarColor || '#001a57';
            const colorChoices = ['#001a57','#006BB6','#ED174C','#475569','#1e293b','#0057a0'];

            fc.innerHTML = `
            <div class="panel-wrap">
                <div class="panel-header"><span class="panel-title">Account Settings</span></div>

                <form id="settingsForm" class="settings-form" style="display:flex;flex-direction:column;gap:1.5rem;padding:1.25rem;">

                    <div style="display:flex;align-items:center;gap:1.25rem;">
                        <div id="settingsAvatar" style="width:84px;height:84px;border-radius:50%;background:${photo?'#0b0f1a':color};display:flex;align-items:center;justify-content:center;font-family:'Lexend', system-ui, sans-serif;font-weight:900;font-size:2rem;color:#fff;overflow:hidden;border:1px solid rgba(0,0,0,0.08);flex-shrink:0;">
                            ${photo?`<img src="${esc(photo)}" alt="" style="width:100%;height:100%;object-fit:cover;">`:initial}
                        </div>
                        <div style="display:flex;flex-direction:column;gap:0.5rem;">
                            <label for="settingsPicInput" style="cursor:pointer;display:inline-block;padding:0.5rem 0.9rem;border:1px solid rgba(13,15,26,0.15);border-radius:4px;font-family:'Lexend', system-ui, sans-serif;font-weight:600;font-size:0.82rem;color:var(--ink);background:#fff;">Upload Photo</label>
                            <input type="file" id="settingsPicInput" accept="image/*" style="display:none;">
                            <button type="button" id="settingsPicRemove" style="background:none;border:none;padding:0;color:#dc2626;font-family:'Lexend', system-ui, sans-serif;font-size:0.78rem;font-weight:500;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;">Remove photo</button>
                            <span id="settingsPicMsg" style="font-size:0.75rem;color:var(--mid);min-height:1em;"></span>
                        </div>
                        <input type="hidden" id="settingsPhotoURL" value="${esc(photo)}">
                    </div>

                    <div>
                        <label class="auth-label">Username</label>
                        <input type="text" class="auth-field" id="settingsUsername" maxlength="12" value="${esc(ud.username||'')}">
                    </div>

                    <div>
                        <label class="auth-label">Bio</label>
                        <textarea class="auth-field" id="settingsBio" rows="3" maxlength="200" style="resize:vertical;font-family:inherit;">${esc(ud.bio||'')}</textarea>
                    </div>

                    <div id="settingsMsg" class="nav-message" style="margin:0;"></div>

                    <div style="display:flex;gap:0.6rem;">
                        <button type="submit" class="auth-submit-btn" style="flex:1;max-width:200px;">Save Changes</button>
                        <button type="button" id="settingsCancel" style="padding:0.78rem 1rem;background:transparent;border:1px solid rgba(13,15,26,0.14);border-radius:4px;font-family:'Lexend', system-ui, sans-serif;font-weight:600;font-size:0.9rem;color:var(--ink);cursor:pointer;">Cancel</button>
                    </div>

                    <div style="margin-top:0.5rem;padding-top:1.25rem;border-top:1px solid var(--border-light);">
                        <div style="font-family:'Lexend', system-ui, sans-serif;font-weight:700;font-size:0.85rem;color:var(--ink);margin-bottom:0.25rem;">Danger zone</div>
                        <p style="font-size:0.8rem;color:var(--mid);margin-bottom:0.65rem;">Permanently delete your account and all associated data.</p>
                        <button type="button" id="settingsDelete" style="padding:0.55rem 0.9rem;background:transparent;border:1px solid #fecaca;border-radius:4px;color:#dc2626;font-family:'Lexend', system-ui, sans-serif;font-weight:600;font-size:0.82rem;cursor:pointer;">Delete account</button>
                    </div>
                </form>
            </div>`;

            const avEl = document.getElementById('settingsAvatar');
            const photoHidden = document.getElementById('settingsPhotoURL');
            const colorHidden = document.getElementById('settingsAvatarColor');
            const picMsg = document.getElementById('settingsPicMsg');

            function repaintAvatar() {
                const p = photoHidden.value;
                const c = colorHidden.value || '#001a57';
                avEl.style.background = p ? '#0b0f1a' : c;
                avEl.innerHTML = p
                    ? `<img src="${esc(p)}" alt="" style="width:100%;height:100%;object-fit:cover;">`
                    : (document.getElementById('settingsUsername').value || 'U').charAt(0).toUpperCase();
            }


            // Photo upload
            const picInput = document.getElementById('settingsPicInput');
            const picRemove = document.getElementById('settingsPicRemove');
            async function fileToCompressedDataUrl(file, maxSide, quality) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onerror = reject;
                    reader.onload = () => {
                        const img = new Image();
                        img.onerror = reject;
                        img.onload = () => {
                            let w = img.width, h = img.height;
                            const scale = Math.min(1, maxSide / Math.max(w, h));
                            w = Math.round(w * scale); h = Math.round(h * scale);
                            const canvas = document.createElement('canvas');
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.src = reader.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            // No Firebase Storage — photo is compressed and saved in Firestore as a data URL
            picInput.onchange = async (ev) => {
                const file = ev.target.files && ev.target.files[0];
                if (!file) return;
                if (!file.type || !file.type.startsWith('image/')) {
                    picMsg.textContent = 'Please choose an image file.'; picMsg.style.color = '#dc2626'; return;
                }
                if (file.size > 8 * 1024 * 1024) {
                    picMsg.textContent = 'Image must be under 8 MB.'; picMsg.style.color = '#dc2626'; return;
                }
                try {
                    picMsg.textContent = 'Processing photo…'; picMsg.style.color = 'var(--mid)';
                    let dataUrl = await fileToCompressedDataUrl(file, 400, 0.7);
                    if (dataUrl.length > 700000) {
                        dataUrl = await fileToCompressedDataUrl(file, 280, 0.55);
                    }
                    if (dataUrl.length > 900000) {
                        picMsg.textContent = 'Image is still too large after compression. Try a smaller photo.';
                        picMsg.style.color = '#dc2626';
                        return;
                    }
                    photoHidden.value = dataUrl;
                    repaintAvatar();
                    picMsg.textContent = 'Photo ready. Click Save Changes to keep it.';
                    picMsg.style.color = '#15803d';
                } catch (err) {
                    console.error(err);
                    picMsg.textContent = 'Could not process photo: ' + (err.message || err);
                    picMsg.style.color = '#dc2626';
                }
            };
            picRemove.onclick = () => {
                photoHidden.value = '';
                repaintAvatar();
                picMsg.textContent = 'Photo removed. Save to keep it.'; picMsg.style.color = 'var(--mid)';
            };
            document.getElementById('settingsUsername').addEventListener('input', repaintAvatar);

            // Cancel
            document.getElementById('settingsCancel').onclick = () => {
                history.pushState(null, '', userBase());
                window.dispatchEvent(new Event('popstate'));
            };

            // Save
            document.getElementById('settingsForm').onsubmit = async (e) => {
                e.preventDefault();
                const msg = document.getElementById('settingsMsg');
                msg.className = 'nav-message';
                const name = document.getElementById('settingsUsername').value.trim();
                if (!name || name.length > 12) {
                    msg.className = 'nav-message error'; msg.textContent = 'Username is required and must be 12 characters or less.';
                    return;
                }
                const bio = document.getElementById('settingsBio').value.trim();
                const photoURL = photoHidden.value || '';
                const avatarColor = (colorHidden && colorHidden.value) || ud.avatarColor || '#001a57';
                const usernameLower = name.toLowerCase().replace(/[^a-z0-9_-]+/g, '-');

                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true; submitBtn.textContent = 'Saving…';
                try {
                    const user = (window.auth && window.auth.currentUser) || (firebase.auth && firebase.auth().currentUser);
                    if (!user) throw new Error('Please sign in again to save settings.');
                    // Auth profile only stores displayName — large data-URL photos go to Firestore only
                    try {
                        await user.updateProfile({ displayName: name });
                    } catch (authErr) {
                        console.warn('Auth displayName update skipped:', authErr);
                    }
                    localStorage.setItem('avatarColor', avatarColor);
                    if (photoURL) localStorage.setItem('photoURL', photoURL); else localStorage.removeItem('photoURL');
                    localStorage.setItem('usernameLower', usernameLower);

                    const db = getDB() || (window.db) || (firebase.firestore && firebase.firestore());
                    if (!db) throw new Error('Database not ready. Refresh and try again.');
                    await db.collection('users').doc(myUid).set({
                        username: name,
                        usernameLower,
                        bio,
                        avatarColor,
                        photoURL: photoURL || null,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });

                    msg.className = 'nav-message success'; msg.textContent = 'Settings saved.';
                    gUserData = { ...gUserData, username: name, usernameLower, bio, avatarColor, photoURL: photoURL || null };
                    renderBanner(gUserData, gPosts.length, gMyUid);
                    if (usernameLower !== slug.toLowerCase()) {
                        slug = usernameLower;
                        history.replaceState(null, '', tabHref('settings'));
                    }
                    if (window.renderUserNav) window.renderUserNav(user);
                } catch (err) {
                    console.error(err);
                    msg.className = 'nav-message error'; msg.textContent = err.message || 'Could not save settings.';
                } finally {
                    submitBtn.disabled = false; submitBtn.textContent = 'Save Changes';
                }
            };

            // Delete
            document.getElementById('settingsDelete').onclick = async () => {
                if (!confirm('Permanently delete your account? This cannot be undone.')) return;
                try {
                    const user = firebase.auth().currentUser;
                    await firebase.firestore().collection('users').doc(myUid).delete().catch(()=>{});
                    await user.delete();
                    location.href = '/';
                } catch (err) {
                    if (err.code === 'auth/requires-recent-login') {
                        alert('For security, please sign out and sign back in, then try again.');
                    } else { alert(err.message); }
                }
            };
        }

        // ── Page renderer ─────────────────────────────────────────
        function renderPage(ud, posts, comments, myUid) {
            gUserData = ud; gPosts = posts; gComments = comments; gMyUid = myUid;
            document.title = `${ud.username || 'User'} — Sixers Hoops`;

            renderBanner(ud, posts.length, myUid);

            document.getElementById('pageContent').innerHTML = `
                <div id="feedContent"></div>
                <div class="profile-sidebar"><div id="sidebarContent"></div></div>`;

            renderSidebar(ud, posts.length, myUid);

            if (currentSubPage === 'inbox') {
                renderInbox(myUid);
            } else if (currentSubPage === 'bookmarks') {
                renderBookmarks(myUid);
            } else if (currentSubPage === 'notifications') {
                renderNotifications(myUid);
            } else if (currentSubPage === 'settings') {
                renderSettings(ud, myUid);
            } else {
                renderFeed();
            }
        }

        function showNotFound(msg) {
            document.getElementById('pageBanner').innerHTML = '';
            document.getElementById('pageContent').innerHTML = `
                <div class="not-found-wrap">
                    <h1>User Not Found</h1>
                    <p>${esc(msg || "We couldn't find a Sixers Hoops member with that username.")}</p>
                    <a href="/">Back to Home</a>
                </div>`;
        }

        // ── Firebase ──────────────────────────────────────────────
        function getDB() {
            if (window.db) return window.db;
            if (typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
                return firebase.firestore();
            }
            return null;
        }

        function waitForDB(cb, n = 0) {
            const d = getDB();
            if (d) { cb(d); return; }
            if (n > 25) { showNotFound('Could not connect.'); return; }
            setTimeout(() => waitForDB(cb, n + 1), 300);
        }

        // If no slug, wait for auth and redirect to the signed-in user's profile.
        if (!slug) {
            const tryRedirect = () => {
                try {
                    const u = firebase.auth().currentUser;
                    if (u) {
                        const lower = (u.displayName || localStorage.getItem('usernameLower') || '').toLowerCase().replace(/[^a-z0-9_-]+/g,'-');
                        if (lower) { location.replace('/user.html?u=' + encodeURIComponent(lower)); return true; }
                    }
                } catch(_) {}
                return false;
            };
            if (!tryRedirect()) {
                try {
                    firebase.auth().onAuthStateChanged(() => { if (!tryRedirect()) showNotFound('Sign in to view your profile.'); });
                } catch(_) { showNotFound('No username in URL.'); }
            }
            return;
        }

        waitForDB(async (db) => {
            // Wait for auth so ownership (settings / notifications / follow) is correct
            function waitForAuth() {
                return new Promise((resolve) => {
                    try {
                        const existing = (window.auth && window.auth.currentUser) || (firebase.auth && firebase.auth().currentUser) || null;
                        if (existing) { resolve(existing.uid); return; }
                        let settled = false;
                        const finish = (uid) => {
                            if (settled) return;
                            settled = true;
                            try { unsub && unsub(); } catch (_) {}
                            resolve(uid || null);
                        };
                        let unsub = null;
                        try {
                            unsub = firebase.auth().onAuthStateChanged((u) => finish(u ? u.uid : null));
                        } catch (_) {
                            finish(null);
                            return;
                        }
                        // Don't block forever if auth is slow/offline
                        setTimeout(() => finish((window.auth && window.auth.currentUser && window.auth.currentUser.uid) || null), 2500);
                    } catch (_) {
                        resolve(null);
                    }
                });
            }

            const myUid = await waitForAuth();

            try {
                let ud = null;
                const slugLower = (slug || '').toLowerCase().replace(/^u\//, '');
                const uidParam = new URLSearchParams(location.search).get('uid');

                // 1) Direct doc id if uid query or slug looks like a Firebase uid
                if (uidParam) {
                    try {
                        const byId = await db.collection('users').doc(uidParam).get();
                        if (byId.exists) ud = { _uid: byId.id, ...byId.data() };
                    } catch(_) {}
                }

                // 2) usernameLower match
                if (!ud) {
                    try {
                        const userSnap = await db.collection('users').where('usernameLower','==',slugLower).limit(1).get();
                        if (!userSnap.empty) ud = { _uid: userSnap.docs[0].id, ...userSnap.docs[0].data() };
                    } catch(_) {}
                }

                // 3) exact username field
                if (!ud) {
                    try {
                        const userSnap = await db.collection('users').where('username','==',slug).limit(1).get();
                        if (!userSnap.empty) ud = { _uid: userSnap.docs[0].id, ...userSnap.docs[0].data() };
                    } catch(_) {}
                }

                // 4) Case-insensitive scan of a limited set of user docs (fallback)
                if (!ud) {
                    try {
                        const all = await db.collection('users').limit(200).get();
                        const hit = all.docs.find(d => {
                            const x = d.data() || {};
                            const a = String(x.usernameLower || '').toLowerCase();
                            const b = String(x.username || '').toLowerCase();
                            return a === slugLower || b === slugLower || b.replace(/[^a-z0-9_-]+/g,'-') === slugLower;
                        });
                        if (hit) ud = { _uid: hit.id, ...hit.data() };
                    } catch(_) {}
                }

                // 5) Infer from community_trades author field if user doc missing
                if (!ud) {
                    try {
                        const trades = await db.collection('community_trades').where('authorId','==',slugLower).limit(1).get();
                        // slug might be username not uid — search recent trades by author string
                    } catch(_) {}
                    try {
                        const recent = await db.collection('community_trades').orderBy('createdAt','desc').limit(80).get();
                        for (const d of recent.docs) {
                            const x = d.data() || {};
                            const handle = String(x.author || '').replace(/^u\//i,'').toLowerCase().replace(/[^a-z0-9_-]+/g,'-');
                            if (handle === slugLower && x.authorId) {
                                ud = {
                                    _uid: x.authorId,
                                    username: String(x.author || '').replace(/^u\//i,''),
                                    usernameLower: handle,
                                    followerCount: 0,
                                    followingCount: 0
                                };
                                // Best-effort create a real users doc so next visit is fast
                                try {
                                    await db.collection('users').doc(x.authorId).set({
                                        username: ud.username,
                                        usernameLower: handle,
                                        createdAt: new Date().toISOString()
                                    }, { merge: true });
                                } catch(_) {}
                                break;
                            }
                        }
                    } catch(_) {}
                }

                if (!ud) { showNotFound(); return; }

                // Normalize usernameLower on the profile if missing
                if (!ud.usernameLower && ud.username) {
                    ud.usernameLower = String(ud.username).toLowerCase().replace(/[^a-z0-9_-]+/g,'-');
                }

                let posts = [], comments = [];

                // Primary: community trades authored by this user
                async function loadByAuthor(col) {
                    try {
                        const ps = await db.collection(col).where('authorId','==',ud._uid).orderBy('createdAt','desc').limit(50).get();
                        return ps.docs.map(d => ({ postId: d.id, id: d.id, ...d.data() }));
                    } catch(_) {
                        try {
                            const ps = await db.collection(col).where('authorId','==',ud._uid).limit(50).get();
                            return ps.docs.map(d => ({ postId: d.id, id: d.id, ...d.data() }));
                        } catch(__) { return []; }
                    }
                }

                const tradePosts = await loadByAuthor('community_trades');
                const feedPosts = await loadByAuthor('community_posts');
                const legacyPosts = await loadByAuthor('posts');
                posts = [...tradePosts, ...feedPosts, ...legacyPosts];
                // Drop ghost/empty posts (deleted content leftovers)
                posts = posts.filter(p => {
                    if (!p || !p.postId && !p.id) return false;
                    const hasTitle = !!(p.title && String(p.title).trim());
                    const hasBody = !!(p.notes || p.summary || p.body || p.content);
                    const hasTrade = !!(p.sides && p.sides.length) || !!p.machineHash;
                    const hasQuote = !!p.quotedPostId;
                    const hasImage = !!p.image;
                    return hasTitle || hasBody || hasTrade || hasQuote || hasImage;
                });
                // De-dupe by id
                const seenIds = new Set();
                posts = posts.filter(p => {
                    const id = p.postId || p.id;
                    if (!id || seenIds.has(id)) return false;
                    seenIds.add(id);
                    return true;
                });
                posts.sort((a,b) => {
                    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : (a.createdAt ? new Date(a.createdAt).getTime() : 0);
                    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : (b.createdAt ? new Date(b.createdAt).getTime() : 0);
                    return tb - ta;
                });

                // Comments live embedded on trade docs — pull this user's comments from their trades + recent trades
                try {
                    const extractComments = (list) => {
                        const out = [];
                        list.forEach(p => {
                            (p.comments || []).forEach(c => {
                                if (c.authorId === ud._uid) {
                                    out.push({
                                        ...c,
                                        postId: p.id || p.postId,
                                        postTitle: p.title || 'Trade',
                                        postUrl: '/community/p/' + encodeURIComponent(p.id || p.postId)
                                    });
                                }
                            });
                        });
                        return out;
                    };
                    comments = extractComments(posts);
                    // Also scan latest trades for comments by this user on others' posts
                    try {
                        const recent = await db.collection('community_trades').orderBy('createdAt','desc').limit(40).get();
                        const others = recent.docs.map(d => ({ id: d.id, ...d.data() }));
                        const more = extractComments(others);
                        const seen = new Set(comments.map(c => c.id));
                        more.forEach(c => { if (c.id && !seen.has(c.id)) comments.push(c); });
                    } catch(_) {}
                    comments.sort((a,b) => {
                        const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                        const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                        return tb - ta;
                    });
                } catch(_) {}

                renderPage(ud, posts, comments, myUid);

                // If auth arrives late (after timeout), re-render so own settings/notifications/follow state update
                try {
                    firebase.auth().onAuthStateChanged((u) => {
                        const uid = u ? u.uid : null;
                        if (uid !== gMyUid && gUserData) {
                            renderPage(gUserData, gPosts, gComments, uid);
                        }
                    });
                } catch (_) {}
            } catch(err) {
                console.error(err);
                showNotFound('Something went wrong loading this profile.');
            }
        });
    })();
    </script>
</body>
