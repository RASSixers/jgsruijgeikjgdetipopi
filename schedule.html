<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Philadelphia 76ers Schedule | SixersHoops</title>
  <meta name="description" content="2026-27 Philadelphia 76ers schedule, results, and upcoming matchups."/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="navbar-styles.css"/>

  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1V9Q0MNEM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T1V9Q0MNEM');
  </script>

  <style>
    :root {
      --navy:#001a57; --navy-deep:#0b0f1a;
      --sixers-blue:#006BB6; --sixers-blue-dark:#0057a0;
      --sixers-red:#ED174C;
      --cream:#ffffff; --ink:#0d0f1a;
      --mid:#64748b; --mid-2:#94a3b8;
      --border-light:#e4e8f0; --card-bg:#ffffff; --surface-soft:#f6f8fc;
      --green:#16a34a; --red:#dc2626; --amber:#d97706;
    }
    *,*::before,*::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body,html {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: 'Lexend', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.5;
      overflow-x: hidden; max-width: 100%;
    }
    body { padding-top: 64px; }
    @media(max-width:480px){ body { padding-top: 60px; } }
    a { color: inherit; }
    button { font-family: inherit; cursor: pointer; }

    /* ─── HERO ─────────────────────────── */
    .hero { background: var(--cream); position: relative; overflow: hidden; padding: 0; }
    .hero-inner {
      position: relative; z-index: 1; max-width: 860px; margin: 0 auto;
      padding: 5rem 2rem 4rem; display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }
    .hero-title-top, .hero-title-bottom {
      font-size: clamp(2.4rem,6vw,4.5rem); font-weight: 700;
      line-height: .95; letter-spacing: -.03em; margin: 0;
    }
    .hero-title-top { color: var(--ink); }
    .hero-title-bottom { color: var(--sixers-blue); }

    /* ─── LAYOUT ──────────────────────── */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
    .section-label {
      font-weight: 500; font-size: .7rem; letter-spacing: .06em;
      text-transform: uppercase; color: var(--mid);
      display: flex; align-items: center; gap: .7rem; margin: 0 0 1rem;
    }
    .section-label .line { flex: 1; height: 1px; background: var(--border-light); }

    /* ─── METRIC CARDS ────────────────── */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: .75rem; margin-bottom: 2.5rem;
    }
    .metric {
      background: var(--card-bg); border: 1px solid var(--border-light);
      border-radius: 12px; padding: 1.15rem 1.2rem 1.1rem;
      position: relative; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.03);
      transition: all .2s;
    }
    .metric:hover { border-color: rgba(0,107,182,.25); box-shadow: 0 6px 18px rgba(0,107,182,.08); transform: translateY(-1px); }
    .metric::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--sixers-blue);
      transform: scaleY(0); transform-origin: top; transition: transform .25s ease;
    }
    .metric:hover::before { transform: scaleY(1); }
    .metric .k {
      font-size: .58rem; letter-spacing: .14em; text-transform: uppercase;
      color: var(--mid); font-weight: 600; display: block; margin-bottom: .5rem;
    }
    .metric .v {
      font-weight: 700; font-size: 1.35rem; color: var(--ink);
      letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1;
      display: block;
    }
    .metric .sub { font-size: .65rem; color: var(--mid-2); font-weight: 500; margin-top: .4rem; display: block; }
    .metric.blue .v { color: var(--sixers-blue); }
    .metric.red .v { color: var(--sixers-red); }
    .metric.green .v { color: var(--green); }

    /* ─── SCHEDULE SECTIONS ──────────── */
    .schedule-container { animation: fadeIn .4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .month-section {
      background: var(--card-bg); border: 1px solid var(--border-light);
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.03);
      margin-bottom: 1.5rem;
    }
    .month-header {
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);
      background: var(--surface-soft);
      display: flex; align-items: center; gap: .6rem;
    }
    .month-header::before { content: ''; width: 4px; height: 18px; background: var(--sixers-blue); border-radius: 2px; }
    .month-title {
      font-weight: 600; font-size: .95rem; letter-spacing: -.01em; color: var(--ink); margin: 0;
    }

    .table-responsive { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-weight: 500; font-size: .62rem;
      letter-spacing: .12em; text-transform: uppercase; color: var(--mid);
      padding: .85rem 1.25rem; border-bottom: 1px solid var(--border-light);
      background: #fff; white-space: nowrap;
    }
    td {
      padding: .95rem 1.25rem; border-bottom: 1px solid var(--border-light);
      font-size: .88rem; color: var(--ink); vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .15s; }
    tbody tr:hover td { background: var(--surface-soft); }

    /* game opponent cell */
    .game-info {
      display: flex; align-items: center; gap: .6rem;
      font-weight: 600; letter-spacing: -.01em; color: var(--ink);
    }
    .opponent-logo { width: 28px; height: 28px; object-fit: contain; }

    .date-cell { color: var(--mid); font-size: .85rem; font-weight: 500; white-space: nowrap; }
    .score-cell { font-weight: 600; font-variant-numeric: tabular-nums; }
    .win-result  { color: var(--green); }
    .loss-result { color: var(--red); }

    /* badges */
    .badge {
      display: inline-block; font-size: .58rem; letter-spacing: .08em;
      font-weight: 600; padding: 3px 9px; border-radius: 999px;
      text-transform: uppercase; border: 1px solid var(--border-light);
      background: var(--surface-soft); color: var(--mid);
    }
    .badge.upcoming { background: rgba(0,107,182,.08); color: var(--sixers-blue); border-color: rgba(0,107,182,.2); }
    .badge.final    { background: var(--surface-soft); color: var(--mid-2); border-color: transparent; }
    .badge.live     {
      background: rgba(237,23,76,.1); color: var(--sixers-red);
      border-color: rgba(237,23,76,.25);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

    /* ─── LOADER ─────────────────────── */
    .loader { text-align: center; padding: 4rem 1rem; color: var(--mid); }
    .loader p { font-size: .8rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-top: .75rem; }
    .loader-spinner {
      border: 3px solid var(--border-light);
      border-top: 3px solid var(--sixers-blue);
      border-radius: 50%; width: 36px; height: 36px;
      animation: spin 1s linear infinite; margin: 0 auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media(max-width:720px) {
      th, td { padding: .75rem .85rem; }
      .wrap { padding: 1rem 1.1rem 3rem; }
    }
    @media(max-width:480px) {
      .hero-inner { padding: 2.8rem 1.25rem 2.4rem; }
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>

  <header class="hero">
    <div class="hero-inner">
      <p class="hero-title-top">SIXERS</p>
      <p class="hero-title-bottom">SCHEDULE</p>
    </div>
  </header>

  <div class="wrap">

    <div class="section-label"><span>Season Snapshot</span><span class="line"></span></div>
    <div class="metric-grid" id="season-snapshot">
      <div class="metric blue">
        <span class="k">Record</span>
        <span class="v" id="stat-record">--</span>
        <span class="sub">Regular season W-L</span>
      </div>
      <div class="metric">
        <span class="k">Games Played</span>
        <span class="v" id="stat-played">--</span>
        <span class="sub">Regular season of 82</span>
      </div>
      <div class="metric red">
        <span class="k">Next Game</span>
        <span class="v" id="stat-next" style="font-size:1rem; line-height:1.3;">--</span>
        <span class="sub" id="stat-next-date">TBD</span>
      </div>
      <div class="metric green">
        <span class="k">Win %</span>
        <span class="v" id="stat-pct">--</span>
        <span class="sub">Regular season</span>
      </div>
    </div>

    <div class="section-label"><span>Game Log</span><span class="line"></span></div>
    <main class="schedule-container" id="schedule">
      <div class="loader">
        <div class="loader-spinner"></div>
        <p>Fetching latest schedule...</p>
      </div>
    </main>

  </div>

  <script src="schedule.js"></script>
</body>
</html>
