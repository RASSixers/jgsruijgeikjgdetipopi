<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Article | Sixers Hoops</title>
<meta name="description" content="Sixers Hoops news and analysis." />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/navbar-styles.css" />
<style>
  :root {
    --navy: #001a57;
    --sixers-blue: #006bb6;
    --sixers-red: #ed174c;
    --cream: #ffffff;
    --ink: #0d0f1a;
    --mid: #64748b;
    --border-light: #e4e8f0;
    --card-bg: #ffffff;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Lexend", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    margin-top: 64px;
  }
  a { color: inherit; text-decoration: none; }

  .article-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4.5rem;
  }
  .article-tag {
    display: inline-flex;
    align-items: center;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 1rem;
  }
  .article-title {
    font-size: clamp(1.8rem, 5vw, 2.7rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.12;
    margin: 0 0 0.85rem;
  }
  .article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    font-size: 0.84rem;
    color: var(--mid);
    margin-bottom: 1.15rem;
  }
  .article-excerpt {
    font-size: 1.02rem;
    line-height: 1.65;
    color: var(--mid);
    margin: 0 0 1.25rem;
  }
  .article-photo {
    margin: 0 0 0.45rem;
    border-radius: 14px;
    overflow: hidden;
    background: #001a57;
    aspect-ratio: 16 / 9;
  }
  .article-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .article-photo-credit {
    font-size: 0.72rem;
    color: #94a3b8;
    margin: 0 0 1.5rem;
  }
  .article-body {
    font-size: 1.02rem;
    line-height: 1.75;
    color: var(--ink);
  }
  .article-body p {
    margin: 0 0 1.15rem;
    white-space: pre-wrap;
  }
  .article-tweet { margin: 1.25rem 0 1.6rem; }
  .grade-block { margin: 1.4rem 0 1.7rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .grade-card {
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    background: #fff;
  }
  .grade-card-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .grade-name { font-weight: 700; }
  .grade-chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2rem; font-size: 0.78rem; font-weight: 700; color: #fff;
    border-radius: 6px; padding: 3px 8px;
  }
  .grade-stats { font-size: 0.82rem; color: var(--mid); margin-top: 0.25rem; }
  .grade-analysis { font-size: 0.92rem; line-height: 1.6; margin-top: 0.45rem; }

  .bottom-line {
    margin: 1.75rem 0 2.5rem;
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 1.1rem 1.2rem 1.2rem;
    background: #f8fafc;
  }
  .bottom-line-label {
    display: block;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sixers-blue);
    margin-bottom: 0.45rem;
  }
  .bottom-line p {
    margin: 0;
    font-size: 0.98rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .more-section { margin-top: 2.75rem; }
  .more-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 0.9rem;
  }
  .more-list { display: flex; flex-direction: column; gap: 0.75rem; }
  .more-item {
    display: block;
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    background: #fff;
  }
  .more-item-title { font-size: 1rem; font-weight: 700; line-height: 1.3; margin: 0.35rem 0 0.3rem; }
  .more-item-excerpt { font-size: 0.86rem; line-height: 1.5; color: var(--mid); margin: 0 0 0.4rem; }
  .more-item-meta { font-size: 0.75rem; color: var(--mid); }

  .article-empty, .article-loading {
    text-align: center;
    color: var(--mid);
    padding: 4rem 1rem;
  }
</style>
</head>
<body>
<main class="article-wrap" id="article-root">
  <div class="article-loading">Loading article…</div>
</main>

<script src="/nav.js"></script>
<script>
const NEWS_COLLECTION = 'editorial_articles';
const CATEGORY_COLORS = {'Player Grades':'#1e7d46','Analysis':'#006BB6','Opinion':'#b06b00','Preview':'#ED174C','Recap':'#475569','News':'#0077cc'};
const GRADE_COLORS = {'A+':'#1a6b3c','A':'#1e7d46','A-':'#2d8f56','B+':'#006BB6','B':'#0077cc','B-':'#2a85d0','C+':'#b06b00','C':'#c27800','D+':'#b83232','D':'#a02828','F':'#7a1a1a','INC':'#6b21a8'};

function waitForDb(cb, tries) {
  tries = tries || 0;
  if (window.db) { cb(); return; }
  if (tries > 60) return;
  setTimeout(function () { waitForDb(cb, tries + 1); }, 250);
}
function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function toDate(ts) {
  if (!ts) return null;
  if (ts.toDate) return ts.toDate();
  return new Date(ts);
}
function timeAgo(date) {
  if (!date) return '';
  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
  if (seconds < 60) return 'Just now';
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return mins + 'm ago';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + 'h ago';
  const days = Math.floor(hours / 24);
  if (days === 1) return 'Yesterday';
  if (days < 7) return days + 'd ago';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function formatDate(date) {
  if (!date) return '';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function readMinutes(article) {
  const text = [article.excerpt, article.intro, article.closing].join(' ') +
    (article.grades || []).map(function (g) { return (g.analysis || '') + ' ' + (g.stats || ''); }).join(' ');
  const words = String(text).trim() ? String(text).trim().split(/\s+/).length : 0;
  return Math.max(1, Math.round(words / 220)) + ' min read';
}
function isPublished(a) {
  return !a.status || a.status === 'published';
}
function getSlug() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('slug')) return params.get('slug');
  const parts = window.location.pathname.replace(/\/+$/, '').split('/');
  const idx = parts.lastIndexOf('article');
  if (idx !== -1 && parts[idx + 1]) return decodeURIComponent(parts[idx + 1]);
  return decodeURIComponent(parts[parts.length - 1] || '');
}
function paragraphs(text) {
  return String(text || '').split(/\n{2,}/).map(function (p) { return p.trim(); }).filter(Boolean);
}
function isTweetUrl(url) {
  return /^https?:\/\/(twitter\.com|x\.com)\/.+\/status\/\d+/i.test(String(url || '').trim());
}

function renderArticle(article, more) {
  const root = document.getElementById('article-root');
  const color = CATEGORY_COLORS[article.category] || '#006bb6';
  const date = toDate(article.createdAt);
  const author = article.author || 'Sixers Hoops Staff';
  document.title = (article.title || 'Article') + ' | Sixers Hoops';

  const photo = article.imageUrl
    ? '<div class="article-photo"><img src="' + escapeHtml(article.imageUrl) + '" alt=""></div>' +
      (article.imageCredit ? '<p class="article-photo-credit">' + escapeHtml(article.imageCredit) + '</p>' : '<div style="height:1rem;"></div>')
    : '';

  const bodyHtml = paragraphs(article.intro).map(function (p) {
    return '<p>' + escapeHtml(p) + '</p>';
  }).join('');

  const tweetHtml = isTweetUrl(article.tweetUrl)
    ? '<div class="article-tweet"><blockquote class="twitter-tweet" data-dnt="true"><a href="' + escapeHtml(article.tweetUrl) + '"></a></blockquote></div>'
    : '';

  const grades = (article.grades || []).filter(function (g) { return g && g.name && g.grade && g.grade !== 'DNP'; });
  const gradesHtml = grades.length
    ? '<div class="grade-block">' + grades.map(function (g) {
        const chip = GRADE_COLORS[g.grade] || '#006bb6';
        return '<div class="grade-card"><div class="grade-card-top"><div class="grade-name">' + escapeHtml(g.name) + '</div>' +
          '<span class="grade-chip" style="background:' + chip + ';">' + escapeHtml(g.grade) + '</span></div>' +
          (g.stats ? '<div class="grade-stats">' + escapeHtml(g.stats) + '</div>' : '') +
          (g.analysis ? '<div class="grade-analysis">' + escapeHtml(g.analysis) + '</div>' : '') +
          '</div>';
      }).join('') + '</div>'
    : '';

  const closingHtml = article.closing
    ? '<aside class="bottom-line"><span class="bottom-line-label">Bottom Line</span><p>' + escapeHtml(article.closing) + '</p></aside>'
    : '';

  const moreHtml = (more || []).length
    ? '<section class="more-section"><h2 class="more-title">More from the desk</h2><div class="more-list">' +
      more.map(function (a) {
        const c = CATEGORY_COLORS[a.category] || '#006bb6';
        return '<a class="more-item" href="/article/' + encodeURIComponent(a.slug || '') + '">' +
          '<span class="article-tag" style="color:' + c + ';background:' + c + '14;border:1px solid ' + c + '33;">' + escapeHtml(a.category || 'News') + '</span>' +
          '<h3 class="more-item-title">' + escapeHtml(a.title || '') + '</h3>' +
          (a.excerpt ? '<p class="more-item-excerpt">' + escapeHtml(a.excerpt) + '</p>' : '') +
          '<div class="more-item-meta">' + escapeHtml(a.author || 'Sixers Hoops Staff') + ' · ' + escapeHtml(timeAgo(toDate(a.createdAt))) + '</div>' +
          '</a>';
      }).join('') + '</div></section>'
    : '';

  root.innerHTML =
    '<span class="article-tag" style="color:' + color + ';background:' + color + '14;border:1px solid ' + color + '33;">' + escapeHtml(article.category || 'News') + '</span>' +
    '<h1 class="article-title">' + escapeHtml(article.title || '') + '</h1>' +
    '<div class="article-meta"><span>' + escapeHtml(author) + '</span><span>·</span><span>' + escapeHtml(formatDate(date)) + '</span><span>·</span><span>' + escapeHtml(readMinutes(article)) + '</span></div>' +
    (article.excerpt ? '<p class="article-excerpt">' + escapeHtml(article.excerpt) + '</p>' : '') +
    photo +
    '<div class="article-body">' + (bodyHtml || '') + '</div>' +
    tweetHtml +
    gradesHtml +
    closingHtml +
    moreHtml;

  if (tweetHtml) {
    if (window.twttr && window.twttr.widgets) window.twttr.widgets.load(root);
    else if (!document.getElementById('twitter-wjs')) {
      const s = document.createElement('script');
      s.id = 'twitter-wjs';
      s.async = true;
      s.src = 'https://platform.twitter.com/widgets.js';
      document.body.appendChild(s);
    }
  }
}

function loadArticle() {
  const slug = getSlug();
  const root = document.getElementById('article-root');
  if (!slug || slug === 'article' || slug === 'article.html') {
    root.innerHTML = '<div class="article-empty">Article not found.</div>';
    return;
  }
  waitForDb(function () {
    window.db.collection(NEWS_COLLECTION).where('slug', '==', slug).limit(1).get().then(function (snap) {
      if (snap.empty) {
        root.innerHTML = '<div class="article-empty">Article not found.</div>';
        return;
      }
      const article = Object.assign({ id: snap.docs[0].id }, snap.docs[0].data());
      if (!isPublished(article)) {
        root.innerHTML = '<div class="article-empty">This article is not published yet.</div>';
        return;
      }
      window.db.collection(NEWS_COLLECTION).orderBy('createdAt', 'desc').limit(8).get().then(function (moreSnap) {
        const more = moreSnap.docs
          .map(function (d) { return Object.assign({ id: d.id }, d.data()); })
          .filter(function (a) { return isPublished(a) && a.slug && a.slug !== article.slug; })
          .slice(0, 3);
        renderArticle(article, more);
      }).catch(function () {
        renderArticle(article, []);
      });
    }).catch(function (err) {
      console.error(err);
      root.innerHTML = '<div class="article-empty">Couldn\'t load this article.</div>';
    });
  });
}

loadArticle();
</script>
</body>
</html>
