<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>NBA Standings | Philadelphia 76ers | SixersHoops</title>
  <meta name="description" content="NBA standings with Eastern and Western Conference tables and the Philadelphia 76ers highlighted."/>
  <link rel="canonical" href="https://sixershoops.com/standings"/>
  <meta name="robots" content="index,follow"/>
  <meta name="theme-color" content="#006BB6"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="navbar-styles.css"/>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1V9Q0MNEM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T1V9Q0MNEM');
  </script>
  <style>
    :root {
      --navy:#001a57; --sixers-blue:#006BB6; --sixers-red:#ED174C;
      --cream:#ffffff; --ink:#0d0f1a; --mid:#64748b; --mid-2:#94a3b8;
      --border-light:#e4e8f0; --card-bg:#ffffff; --surface-soft:#f6f8fc;
      --green:#16a34a; --red:#dc2626;
    }
    *,*::before,*::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body,html {
      margin: 0; background: var(--cream); color: var(--ink);
      font-family: 'Lexend', system-ui, sans-serif; line-height: 1.5;
    }
    body { padding-top: 64px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .hero-inner { max-width: 860px; margin: 0 auto; padding: 5rem 2rem 3.2rem; text-align: center; }
    .hero-title-top, .hero-title-bottom {
      font-size: clamp(2.4rem,6vw,4.5rem); font-weight: 700;
      line-height: .95; letter-spacing: -.03em; margin: 0;
    }
    .hero-title-bottom { color: var(--sixers-blue); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem 2rem 4rem; }
    .season-picker-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
      margin: 0 0 1.25rem;
    }
    .season-picker-bar label {
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      font-weight: 600; color: var(--mid);
    }
    #season-select {
      font: inherit; font-weight: 600; font-size: .9rem;
      padding: .45rem .8rem; border: 1px solid var(--border-light);
      border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer;
    }
    #season-status { font-size: .82rem; color: var(--mid); }
    .export-bar { display: flex; flex-wrap: wrap; gap: .45rem; margin: 0 0 1.25rem; }
    .export-btn {
      border: 1px solid var(--border-light); background: #fff; color: var(--ink);
      border-radius: 999px; padding: .35rem .75rem; font: inherit; font-size: .78rem;
      font-weight: 600; cursor: pointer;
    }
    .export-btn:hover { border-color: var(--sixers-blue); color: var(--sixers-blue); }
    .conference-section {
      background: var(--card-bg); border: 1px solid var(--border-light);
      border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem;
    }
    .conference-title {
      margin: 0; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light);
      background: var(--surface-soft); font-size: 1.05rem; font-weight: 700;
    }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
      color: var(--mid); padding: .85rem 1.25rem; border-bottom: 1px solid var(--border-light);
    }
    td {
      padding: .8rem 1.25rem; border-bottom: 1px solid var(--border-light);
      font-size: .88rem; vertical-align: middle;
    }
    .team-info { display: flex; align-items: center; gap: .65rem; font-weight: 600; }
    .rank { color: var(--mid); width: 1.4rem; display: inline-block; font-variant-numeric: tabular-nums; }
    .sixers-highlight td { background: rgba(0,107,182,.07); }
    .pct, .gb { font-variant-numeric: tabular-nums; }
    .status-badge {
      display: inline-block; font-size: .72rem; font-weight: 700;
      letter-spacing: .04em; padding: 3px 8px; border-radius: 999px;
    }
    .streak-w { color: var(--green); background: rgba(22,163,74,.1); }
    .streak-l { color: var(--red); background: rgba(220,38,38,.1); }
    .preseason-note { margin: 0 0 1rem; color: var(--mid); font-size: .9rem; }
    .loader { text-align: center; padding: 4rem 1rem; color: var(--mid); }
    .loader-spinner {
      border: 3px solid var(--border-light); border-top: 3px solid var(--sixers-blue);
      border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Compact social card: 1080 x ~1080, capture-safe */
    #social-export-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1080px;
      padding: 0;
      background: #f4f6fa;
      color: #0d0f1a;
      font-family: 'Lexend', system-ui, sans-serif;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }
    #social-export-container.single-conf {
      width: 1080px;
      height: 1350px;
    }
    .social-topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: #001a57;
      color: #fff;
    }
    .social-wordmark {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .social-top-meta {
      margin: 0;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #93c5fd;
      font-weight: 600;
    }
    .social-header {
      padding: 22px 28px 16px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      background: #f4f6fa;
    }
    .social-title-box h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1;
      letter-spacing: -.03em;
      font-weight: 800;
      color: #0d0f1a;
    }
    #export-date {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
    }
    .social-accent {
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #006BB6 0%, #006BB6 55%, #ED174C 55%, #ED174C 100%);
    }
    #social-export-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: 18px 22px 22px;
      height: calc(1080px - 56px - 78px - 4px);
    }
    #social-export-container.single-conf #social-export-content {
      grid-template-columns: 1fr;
      height: calc(1350px - 56px - 78px - 4px);
    }
    .social-conference {
      background: #fff;
      border: 1px solid #e6ebf3;
      border-radius: 14px;
      padding: 14px 12px 10px;
      min-width: 0;
      overflow: hidden;
    }
    .social-conf-title {
      margin: 0 0 8px;
      padding: 0 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #006BB6;
    }
    .social-table { width: 100%; border-collapse: collapse; }
    .social-table th {
      text-align: left;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #94a3b8;
      padding: 6px 6px;
      border-bottom: 1px solid #eef2f7;
      background: transparent;
    }
    .social-table td {
      padding: 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
      color: #0d0f1a;
      background: transparent;
    }
    .social-table tr:last-child td { border-bottom: 0; }
    .social-table .cell-content {
      padding: 5px 6px;
      min-height: 28px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    .social-team {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    .social-team-name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 210px;
    }
    .social-team-rank {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef3f9;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      flex: 0 0 auto;
    }
    .social-sixers-row td { background: #e8f3fb; }
    .social-sixers-row .social-team-rank { background: #006BB6; color: #fff; }
    .social-streak-badge { font-weight: 700; font-size: 12px; }
    .social-streak-w { color: #16a34a; }
    .social-streak-l { color: #dc2626; }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(13,15,26,.55);
      align-items: center; justify-content: center; z-index: 80; padding: 1rem;
    }
    .modal-card {
      background: #fff; border-radius: 16px; max-width: 560px; width: 100%;
      max-height: calc(100vh - 2rem); overflow: auto;
      padding: 1rem; box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }
    .modal-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .85rem; }
    #exportPreview {
      width: 100%;
      height: auto;
      max-height: 62vh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: #f4f6fa;
    }

    @media (max-width: 720px) {
      .wrap { padding: 1rem 1.1rem 3rem; }
      .hero-inner { padding: 2.8rem 1.25rem 2.2rem; }
      th:nth-child(6), td:nth-child(6),
      th:nth-child(7), td:nth-child(7) { display: none; }
    }
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <header class="hero">
    <div class="hero-inner">
      <h1 class="sr-only">NBA Standings</h1>
      <p class="hero-title-top" aria-hidden="true">NBA</p>
      <p class="hero-title-bottom" aria-hidden="true">STANDINGS</p>
    </div>
  </header>
  <div class="wrap">
    <div class="season-picker-bar">
      <label for="season-select">Season</label>
      <select id="season-select" aria-label="Select NBA season standings"></select>
      <span id="season-status"></span>
    </div>
    <div class="export-bar">
      <button type="button" class="export-btn" data-export-mode="all">Export both conferences</button>
      <button type="button" class="export-btn" data-export-mode="east">Export East</button>
      <button type="button" class="export-btn" data-export-mode="west">Export West</button>
    </div>
    <main id="standings">
      <div class="loader">
        <div class="loader-spinner"></div>
        <p>Loading teams...</p>
      </div>
    </main>
  </div>

  <div id="social-export-container">
    <div class="social-topbar">
      <p class="social-wordmark">SixersHoops</p>
      <p class="social-top-meta" id="social-top-meta">NBA Standings</p>
    </div>
    <div class="social-header">
      <div class="social-title-box">
        <h1>NBA Standings</h1>
        <p id="export-date"></p>
      </div>
    </div>
    <div class="social-accent"></div>
    <div id="social-export-content"></div>
  </div>

  <div class="modal" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="export-title">
    <div class="modal-card">
      <h2 id="export-title" style="margin:0 0 .75rem;">Export preview</h2>
      <img id="exportPreview" alt="Standings export preview"/>
      <div class="modal-actions">
        <button type="button" class="export-btn" id="downloadBtn">Download PNG</button>
        <button type="button" class="export-btn" id="copyBtn">Copy to Clipboard</button>
        <button type="button" class="export-btn" id="closeModal">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="standings.js"></script>
</body>
</html>
